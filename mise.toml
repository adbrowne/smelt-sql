[tools]
rust = "1.95"
node = "24"
# shellcheck backs the shell-lint gate in verify-phase.sh. Unlike the Cloud SDK
# (a task, not a tool, because 200MB in seven CI jobs that never use it is
# waste), this is ~1MB and every job that runs the gate needs it — so a
# [tools] pin is right and the gate can fail rather than skip green.
shellcheck = "0.11"

[env]
# DUCKDB_LIB_DIR mirrors the manual setup snippet in CLAUDE.md's "Build and
# Test" section: prefer a system-wide install (/usr/local/lib, where CI puts
# it), fall back to the user-local install `mise run setup-duckdb` makes.
# Empty (not yet installed) is tolerated — cargo build will fail with its own
# clear error rather than this template failing.
DUCKDB_LIB_DIR = "{{ exec(command='bash scripts/mise-duckdb-lib-dir.sh') }}"
LD_LIBRARY_PATH = "{{ env.DUCKDB_LIB_DIR }}:{{ env.LD_LIBRARY_PATH | default(value='') }}"

# Cap cargo's parallelism. Cargo defaults `-j` to the core count, so N agent
# sessions working in N worktrees fan out to N x nproc rustc processes on one
# machine. Measured on this 32-core box: a clean `cargo test --no-run` takes
# 197s idle and 987s when three sessions build concurrently — a 5x penalty from
# oversubscription and the memory pressure that comes with it, not from the
# suite being slow.
#
# 12 is chosen for ~3 concurrent sessions (36 jobs on 32 cores is mild and
# harmless). Working solo costs some idle cores; override per-machine in
# .mise.local.toml, or per-command with `CARGO_BUILD_JOBS=32 cargo test`.
CARGO_BUILD_JOBS = "12"

# The Cloud SDK's bin directory, for the BigQuery paths. Resolved the same way
# DUCKDB_LIB_DIR is: prefer whatever is already on PATH, else the locations
# `mise run setup-gcloud` installs to. Empty (not installed) is tolerated — the
# scripts that need it fail with their own clear message. When nothing is
# installed the resolver prints the not-yet-existent install location rather
# than an empty string, because an empty PATH entry means the current
# directory.
#
# It goes on PATH rather than being consumed as a variable because `bq` shells
# out to `gcloud` BY NAME: an absolute path to `bq` alone fails.
# `_.path` is mise's mechanism for this; a bare `PATH =` key is silently
# ignored (measured — gcloud stayed unresolvable under `mise exec`).
_.path = "{{ exec(command='bash scripts/mise-gcloud-bin-dir.sh') }}"

[tasks.setup-gcloud]
description = "Install the Google Cloud SDK (gcloud, bq) into ~/.local if not already present"
run = "bash scripts/mise-setup-gcloud.sh"

[tasks.setup-duckdb]
description = "Install the DuckDB shared library (v1.5.4) into ~/.local/lib/duckdb if not already present"
run = "bash scripts/mise-setup-duckdb.sh"

[tasks.verify]
description = "Standard pre-commit gate: fmt + clippy + tests + example_diagnostics"
run = "bash .claude/scripts/verify-phase.sh"

[tasks.verify-fast]
description = "verify, skipping the full cargo test run"
run = "bash .claude/scripts/verify-phase.sh --fast"

[tasks.shellcheck]
description = "Shell lint gate (scripts/ and .claude/scripts/, warning severity)"
run = "bash .claude/scripts/shellcheck-gate.sh"

[tasks.clippy]
description = "Clippy gate (both CI feature sets)"
run = "bash .claude/scripts/clippy-gate.sh"

[tasks.build]
description = "cargo build --workspace"
run = "cargo build"

[tasks.test]
description = "cargo test --workspace"
run = "cargo test"
