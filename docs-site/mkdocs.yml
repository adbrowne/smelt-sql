site_name: smelt
site_url: https://adbrowne.github.io/smelt-sql/
site_description: Modern data transformation framework
repo_url: https://github.com/adbrowne/smelt-sql
repo_name: adbrowne/smelt-sql

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - Guide:
    - SQL Models: guide/sql-models.md
    - Editor Setup: guide/editor-setup.md
  - Reference:
    - Language Spec: reference/language.md
