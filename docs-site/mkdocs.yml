site_name: smelt
site_url: https://smeltsql.com/
site_description: Modern data transformation framework
repo_url: https://github.com/adbrowne/smelt-sql
repo_name: adbrowne/smelt-sql

theme:
  name: material
  logo: assets/logo-mark.svg
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.tracking
    - navigation.instant
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

edit_uri: edit/main/docs-site/docs/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - def_list

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - Concepts:
    - How smelt Works: concepts/how-it-works.md
    - Project Structure: concepts/project-structure.md
  - Meta-Language:
    - Overview: meta-language/index.md
    - Lists & Spread: meta-language/lists.md
    - Higher-Order Functions: meta-language/hofs.md
    - Lambdas: meta-language/lambdas.md
    - Pipe Operator: meta-language/pipes.md
    - Reducers: meta-language/reducers.md
    - Ternary: meta-language/ternary.md
    - Records: meta-language/records.md
    - Maps: meta-language/maps.md
    - Reflection: meta-language/reflection.md
    - Config Loaders: meta-language/config-loaders.md
    - Config Variables: meta-language/config-vars.md
    - Generator Files: meta-language/generators.md
    - Reference: meta-language/reference.md
  - Guide:
    - SQL Models: guide/sql-models.md
    - Pipe Syntax: guide/pipe-syntax.md
    - Sources: guide/sources.md
    - Materializations: guide/materializations.md
    - Incremental Models: guide/incremental-models.md
    - Schema Evolution: guide/schema-evolution.md
    - Seeds: guide/seeds.md
    - Data Generation: guide/datagen.md
    - Model Selection: guide/model-selection.md
    - Python Models: guide/python-models.md
    - Functions: guide/functions.md
    - Testing: guide/testing.md
    - Targets & Backends: guide/targets.md
    - Web UI: guide/web-ui.md
    - Editor Setup: guide/editor-setup.md
    - Editor Features: guide/editor-features.md
  - Examples:
    - Web Analytics: examples/web_analytics.md
  - Reference:
    - CLI Commands: reference/cli.md
    - Project Configuration: reference/smelt-yml.md
    - Sources Configuration: reference/sources-yml.md
    - Timeseries: reference/timeseries.md
    - keyed: reference/cumulative-aggregate.md
    - Language Spec: reference/language.md
  - Developing smelt:
    - Architecture: developing/architecture.md
    - Contributing: developing/contributing.md
