name: Dev Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-release
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Compute dev version from Cargo.toml + timestamp + SHA
  # ---------------------------------------------------------------------------
  compute-version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      dev_version: ${{ steps.version.outputs.dev_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute dev version
        id: version
        run: |
          base_version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          timestamp=$(date -u +%Y%m%d%H%M)
          short_sha=$(git rev-parse --short HEAD)
          dev_version="${base_version}-dev.${timestamp}"
          tag_name="dev-$(date -u +%Y%m%d)-${short_sha}"
          echo "dev_version=${dev_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "Dev version: ${dev_version}"
          echo "Tag: ${tag_name}"

  # ---------------------------------------------------------------------------
  # Build Python wheels via maturin
  # ---------------------------------------------------------------------------
  build-wheels:
    name: Wheel / ${{ matrix.name }}
    needs: [compute-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet

      - name: Patch version in Cargo.toml
        shell: bash
        run: |
          DEV_VERSION="${{ needs.compute-version.outputs.dev_version }}"
          sed -i.bak "s/^version = \".*\"/version = \"${DEV_VERSION}\"/" Cargo.toml
          # Also patch inter-crate version dependencies to match
          find crates -name Cargo.toml -exec sed -i.bak "s/version = \"0\.1\.0\"/version = \"${DEV_VERSION}\"/" {} +
          echo "Patched Cargo.toml version:"
          grep -m1 '^version' Cargo.toml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-dev-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build frontend
        run: cd ui && npm ci && npm run build

      - name: Build smelt-lsp for wheel (non-Linux)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p smelt-lsp
          mkdir -p smelt_sql.data/scripts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/smelt-lsp.exe smelt_sql.data/scripts/
          else
            cp target/${{ matrix.target }}/release/smelt-lsp smelt_sql.data/scripts/
          fi

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features bundled-duckdb
          manylinux: auto
          docker-options: -e CXXFLAGS=-DDUCKDB_CUSTOM_PLATFORM=${{ contains(matrix.target, 'aarch64') && 'linux_arm64_gcc4' || 'linux_amd64_gcc4' }}
          before-script-linux: |
            cargo build --release -p smelt-lsp
            mkdir -p smelt_sql.data/scripts
            cp target/release/smelt-lsp smelt_sql.data/scripts/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # Build standalone binaries
  # ---------------------------------------------------------------------------
  build-standalone:
    name: Standalone / ${{ matrix.name }}
    needs: [compute-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet

      - name: Patch version in Cargo.toml
        shell: bash
        run: |
          DEV_VERSION="${{ needs.compute-version.outputs.dev_version }}"
          sed -i.bak "s/^version = \".*\"/version = \"${DEV_VERSION}\"/" Cargo.toml
          # Also patch inter-crate version dependencies to match
          find crates -name Cargo.toml -exec sed -i.bak "s/version = \"0\.1\.0\"/version = \"${DEV_VERSION}\"/" {} +
          echo "Patched Cargo.toml version:"
          grep -m1 '^version' Cargo.toml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-dev-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build frontend
        run: cd ui && npm ci && npm run build

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p smelt-cli -p smelt-lsp --features smelt-cli/bundled-duckdb

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          staging="smelt-dev-${{ matrix.name }}"
          mkdir "$staging"
          cp target/${{ matrix.target }}/release/smelt "$staging/"
          cp target/${{ matrix.target }}/release/smelt-lsp "$staging/"
          cp LICENSE README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "smelt-dev-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $staging
          Copy-Item "target/${{ matrix.target }}/release/smelt.exe" "$staging/"
          Copy-Item "target/${{ matrix.target }}/release/smelt-lsp.exe" "$staging/"
          Copy-Item "LICENSE", "README.md" "$staging/"
          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip"

      - name: Upload standalone archive
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.name }}
          path: smelt-dev-${{ matrix.name }}.${{ matrix.archive }}

  # ---------------------------------------------------------------------------
  # Create GitHub pre-release
  # ---------------------------------------------------------------------------
  dev-release:
    name: Dev Release
    needs: [compute-version, build-wheels, build-standalone]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir release-assets
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute-version.outputs.tag_name }}
          name: "Dev Build ${{ needs.compute-version.outputs.dev_version }}"
          body: |
            Automated dev build from `main` at ${{ needs.compute-version.outputs.short_sha }}.

            **Version:** `${{ needs.compute-version.outputs.dev_version }}`

            ## Install

            ```bash
            pip install smelt-sql --pre
            ```

            Or download standalone binaries from the assets below.
          files: release-assets/*
          prerelease: true
          make_latest: false

  # ---------------------------------------------------------------------------
  # Publish dev wheels to TestPyPI
  # ---------------------------------------------------------------------------
  pypi-publish:
    name: Publish to TestPyPI
    needs: [dev-release]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/smelt-sql
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
