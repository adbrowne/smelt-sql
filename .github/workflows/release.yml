name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Version check — ensure tag matches version strings in config files
  # ---------------------------------------------------------------------------
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check Cargo.toml version
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$cargo_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Cargo.toml version ($cargo_version) does not match tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

      - name: Check VSCode extension version
        run: |
          vscode_version=$(node -p "require('./editors/vscode/package.json').version")
          if [ "$vscode_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::editors/vscode/package.json version ($vscode_version) does not match tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Build Python wheels via maturin
  # ---------------------------------------------------------------------------
  build-wheels:
    name: Wheel / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build frontend
        run: cd ui && npm ci && npm run build

      - name: Build smelt-lsp and smelt-datagen for wheel (non-Linux)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p smelt-lsp -p smelt-datagen --no-default-features
          mkdir -p smelt_sql.data/scripts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/smelt-lsp.exe smelt_sql.data/scripts/
            cp target/${{ matrix.target }}/release/smelt-datagen.exe smelt_sql.data/scripts/
          else
            cp target/${{ matrix.target }}/release/smelt-lsp smelt_sql.data/scripts/
            cp target/${{ matrix.target }}/release/smelt-datagen smelt_sql.data/scripts/
          fi

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features bundled-duckdb
          manylinux: 2_28
          docker-options: -e CXXFLAGS=-DDUCKDB_CUSTOM_PLATFORM=${{ contains(matrix.target, 'aarch64') && 'linux_arm64_gcc4' || 'linux_amd64_gcc4' }}
          before-script-linux: |
            cargo build --release -p smelt-lsp -p smelt-datagen --no-default-features
            mkdir -p smelt_sql.data/scripts
            cp target/release/smelt-lsp smelt_sql.data/scripts/
            cp target/release/smelt-datagen smelt_sql.data/scripts/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # Build source distribution (sdist)
  # ---------------------------------------------------------------------------
  build-sdist:
    name: Source Distribution (sdist)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sdist-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Create data directory for maturin
        run: mkdir -p smelt_sql.data/scripts

      - name: Build sdist
        run: maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # Build standalone binaries
  # ---------------------------------------------------------------------------
  build-standalone:
    name: Standalone / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build frontend
        run: cd ui && npm ci && npm run build

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p smelt-cli -p smelt-lsp -p smelt-datagen --features smelt-cli/bundled-duckdb

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          staging="smelt-${{ matrix.name }}"
          mkdir "$staging"
          cp target/${{ matrix.target }}/release/smelt "$staging/"
          cp target/${{ matrix.target }}/release/smelt-lsp "$staging/"
          cp target/${{ matrix.target }}/release/smelt-datagen "$staging/"
          cp LICENSE README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "smelt-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $staging
          Copy-Item "target/${{ matrix.target }}/release/smelt.exe" "$staging/"
          Copy-Item "target/${{ matrix.target }}/release/smelt-lsp.exe" "$staging/"
          Copy-Item "target/${{ matrix.target }}/release/smelt-datagen.exe" "$staging/"
          Copy-Item "LICENSE", "README.md" "$staging/"
          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip"

      - name: Upload standalone archive
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.name }}
          path: smelt-${{ matrix.name }}.${{ matrix.archive }}

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [version-check, build-wheels, build-sdist, build-standalone]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir release-assets
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        id: notes
        run: |
          # Find previous tag
          prev_tag=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -n "$prev_tag" ]; then
            echo "## Changes since ${prev_tag}" > release-notes.md
            echo "" >> release-notes.md
            git log "${prev_tag}..HEAD" --pretty=format:"- %s" --no-merges >> release-notes.md
          else
            echo "## Initial Release" > release-notes.md
            echo "" >> release-notes.md
            git log --pretty=format:"- %s" --no-merges -20 >> release-notes.md
          fi
          echo "" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Installation" >> release-notes.md
          echo "" >> release-notes.md
          echo '```bash' >> release-notes.md
          echo "pip install smelt-sql" >> release-notes.md
          echo '```' >> release-notes.md
          echo "" >> release-notes.md
          echo "Or download standalone binaries from the assets below." >> release-notes.md

      - name: Determine pre-release
        id: prerelease
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '(-rc|-beta|-alpha)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-assets/*
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

  # ---------------------------------------------------------------------------
  # Publish to PyPI (stable releases only)
  # ---------------------------------------------------------------------------
  pypi-publish:
    name: Publish to PyPI
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/smelt-sql
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Publish to TestPyPI (pre-releases only)
  # ---------------------------------------------------------------------------
  testpypi-publish:
    name: Publish to TestPyPI
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha'))
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Publish VSCode extension (stable releases only)
  # ---------------------------------------------------------------------------
  vscode-publish:
    name: Publish VSCode Extension
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd editors/vscode && npm ci

      - name: Publish to VS Marketplace
        run: cd editors/vscode && npx vsce publish -p ${{ secrets.VS_MARKETPLACE_TOKEN }}

      - name: Publish to Open VSX
        continue-on-error: true
        run: cd editors/vscode && npx ovsx publish -p ${{ secrets.OPEN_VSX_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish crates to crates.io (stable releases only)
  # ---------------------------------------------------------------------------
  crates-publish:
    name: Publish to crates.io
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish smelt-types
        run: cargo publish -p smelt-types

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish smelt-parser
        run: cargo publish -p smelt-parser

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish smelt-dialect
        run: cargo publish -p smelt-dialect
