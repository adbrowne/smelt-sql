name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r docs-site/requirements.txt

      - name: Build site
        run: cd docs-site && mkdocs build --strict

      - name: Publish to gh-pages (root)
        uses: ./.github/actions/publish-docs
        with:
          source-dir: docs-site/site
          target-dir: "."
          commit-message: "docs: publish ${{ github.sha }}"
