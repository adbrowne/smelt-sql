name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build site
        working-directory: docs-site
        run: uv run mkdocs build --strict

      - name: Publish to gh-pages (root)
        uses: ./.github/actions/publish-docs
        with:
          source-dir: docs-site/site
          target-dir: "."
          commit-message: "docs: publish ${{ github.sha }}"
