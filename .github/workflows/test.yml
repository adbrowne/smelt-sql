name: Tests

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

env:
  DUCKDB_LIB_DIR: /usr/local/lib

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # Shared with the local pre-commit gate (.claude/scripts/verify-phase.sh)
        # so CI and local can't drift into linting different feature sets.
        run: bash .claude/scripts/clippy-gate.sh

      - name: Run hardening budget gate
        # Counts production unwrap/expect/println per crate (excluding test code)
        # and compares against the committed baseline in .claude/hardening-baseline.txt.
        # Exits non-zero if any crate exceeds its baseline (regression) or falls
        # below it (debt paid but baseline not updated — run --update to tighten).
        # Uses bash/sed/awk/find only; no ripgrep needed.
        run: bash .claude/scripts/hardening-budget.sh

  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Build frontend
        run: cd ui && npm ci && npm run build

      - name: Run unit tests
        run: cargo test --lib --no-default-features --features smelt-cli/duckdb,smelt-ui/duckdb

      - name: Run property-based tests (quick)
        run: cargo test --test proptest_round_trip -- --test-threads=1
        env:
          PROPTEST_CASES: 100

      - name: Run PostgreSQL compatibility tests (quick)
        run: cargo test -p smelt-parser-compat --test parse_equivalence -- --test-threads=1
        env:
          PROPTEST_CASES: 100

      - name: Verify example workspaces have no diagnostics (Salsa-direct path)
        run: cargo test -p smelt-cli --no-default-features --features duckdb --test example_diagnostics

      - name: Maintenance-plan equivalence gate (Link-C schedule suite)
        run: cargo test -p smelt-cli --no-default-features --features duckdb --test property_discovery

      - name: Maintenance-plan conformance gate (generative regression net)
        run: cargo test -p smelt-cli --no-default-features --features duckdb --test maintenance_conformance

      - name: Dialect emission ownership gate
        # `printer.rs` holds no name-matched dialect arm — a built-in's
        # per-dialect spelling is registry data (architecture.md §Constraints
        # item 14).
        run: cargo test -p smelt-dialect --test emission_ownership

      - name: Dialect audit (DuckDB legs, totality, ledger)
        # Offline: the enumeration's totality gates, the two DuckDB legs, and
        # the two-sided divergence ledger with its gap ratchet. The Spark and
        # BigQuery legs of the same binary skip green without their engines.
        run: cargo test -p smelt-db --no-default-features --test dialect_audit

      - name: Dialect seam (compile-path emission refusal)
        run: cargo test -p smelt-runtime --test dialect_seam

      - name: Run LSP integration tests
        # All integration tests under crates/smelt-lsp/tests/ — completion,
        # diagnostics, e2e, example_workspaces, goto_definition, hover,
        # integration, missing_sidecar, phase48_lsp_polish, pin_schema_action,
        # rename_lambda. The previous `cargo test --lib` step skips them
        # because --lib filters to unit tests inside src/.
        #
        # example_workspaces is the standing safety net for the workspace
        # loading parity rule (docs/specs/architecture.md). The other 10
        # tests cover protocol-level behavior that's also LSP-specific.
        run: cargo test -p smelt-lsp --no-default-features --tests

      - name: Run smelt model tests (example projects)
        run: |
          cargo run -p smelt-cli --no-default-features --features duckdb --quiet -- test --project-dir examples/retail_analytics
          cargo run -p smelt-cli --no-default-features --features duckdb --quiet -- test --project-dir examples/timeseries
          cargo run -p smelt-cli --no-default-features --features duckdb --quiet -- test --project-dir examples/ephemeral_demo

      - name: Regenerate Maintenance Atlas + smoke test
        # Regression gate for the atlas pipeline (crates/smelt-maintenance-testkit/examples/stage_atlas.rs
        # + scripts/atlas/*): rebuilds it from the example workspaces and testkit
        # recipe specimens and smoke-runs its app.js against the fresh data. This
        # is a correctness gate, not a publish step — the HTML is uploaded as a
        # build artifact for inspection, never wired into docs-site.
        run: bash scripts/atlas/generate.sh

      - name: Upload Maintenance Atlas artifact
        uses: actions/upload-artifact@v6
        with:
          name: maintenance-atlas
          path: target/atlas/atlas.html
          retention-days: 14

  fuzz-build:
    name: Fuzz Targets Build Check
    runs-on: ubuntu-latest
    env:
      # Job-level, not step-level: mise's shims re-resolve the tool version
      # from env on every invocation, so a later step needs this visible too.
      MISE_RUST_VERSION: nightly

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise (rust nightly)
        uses: jdx/mise-action@v2

      - name: Cache fuzz build
        uses: actions/cache@v5
        with:
          path: crates/smelt-parser/fuzz/target
          key: ${{ runner.os }}-fuzz-build-${{ hashFiles('crates/smelt-parser/fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Build fuzz targets
        run: |
          cd crates/smelt-parser
          cargo fuzz build

  docker-changes:
    name: Detect Docker-relevant changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1') }}
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'crates/**'
              - 'ui/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/test.yml'

  docker-build:
    name: Docker Build Check
    needs: [docker-changes]
    if: needs.docker-changes.outputs.docker == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smelt-ci-check:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm smelt-ci-check:latest --version
          docker run --rm -v "$PWD/examples/bounded_domain_declared:/w" -w /w smelt-ci-check:latest build
