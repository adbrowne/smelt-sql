name: Tests

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

env:
  DUCKDB_LIB_DIR: /usr/local/lib

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: >
          cargo clippy
          --all-targets
          --no-default-features
          --features smelt-cli/duckdb,smelt-ui/duckdb
          -- -D warnings

      - name: Run hardening budget gate
        # Counts production unwrap/expect/println per crate (excluding test code)
        # and compares against the committed baseline in .claude/hardening-baseline.txt.
        # Exits non-zero if any crate exceeds its baseline (regression) or falls
        # below it (debt paid but baseline not updated — run --update to tighten).
        # Uses bash/sed/awk/find only; no ripgrep needed.
        run: bash .claude/scripts/hardening-budget.sh

  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build frontend
        run: cd ui && npm ci && npm run build

      - name: Run unit tests
        run: cargo test --lib --no-default-features --features smelt-cli/duckdb,smelt-ui/duckdb

      - name: Run property-based tests (quick)
        run: cargo test --test proptest_round_trip -- --test-threads=1
        env:
          PROPTEST_CASES: 100

      - name: Run PostgreSQL compatibility tests (quick)
        run: cargo test -p smelt-parser-compat --test parse_equivalence -- --test-threads=1
        env:
          PROPTEST_CASES: 100

      - name: Verify example workspaces have no diagnostics (Salsa-direct path)
        run: cargo test -p smelt-cli --no-default-features --features duckdb --test example_diagnostics

      - name: Maintenance-plan equivalence gate (Link-C schedule suite)
        run: cargo test -p smelt-cli --no-default-features --features duckdb --test property_discovery

      - name: Maintenance-plan conformance gate (generative regression net)
        run: cargo test -p smelt-cli --no-default-features --features duckdb --test maintenance_conformance

      - name: Run LSP integration tests
        # All integration tests under crates/smelt-lsp/tests/ — completion,
        # diagnostics, e2e, example_workspaces, goto_definition, hover,
        # integration, missing_sidecar, phase48_lsp_polish, pin_schema_action,
        # rename_lambda. The previous `cargo test --lib` step skips them
        # because --lib filters to unit tests inside src/.
        #
        # example_workspaces is the standing safety net for the workspace
        # loading parity rule (docs/specs/architecture.md). The other 10
        # tests cover protocol-level behavior that's also LSP-specific.
        run: cargo test -p smelt-lsp --no-default-features --tests

      - name: Run smelt model tests (example projects)
        run: |
          cargo run -p smelt-cli --no-default-features --features duckdb --quiet -- test --project-dir examples/retail_analytics
          cargo run -p smelt-cli --no-default-features --features duckdb --quiet -- test --project-dir examples/timeseries
          cargo run -p smelt-cli --no-default-features --features duckdb --quiet -- test --project-dir examples/ephemeral_demo

  fuzz-build:
    name: Fuzz Targets Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache fuzz build
        uses: actions/cache@v5
        with:
          path: crates/smelt-parser/fuzz/target
          key: ${{ runner.os }}-fuzz-build-${{ hashFiles('crates/smelt-parser/fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Build fuzz targets
        run: |
          cd crates/smelt-parser
          cargo +nightly fuzz build
