name: Tests

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (core crates)
        run: >
          cargo clippy
          --workspace
          --exclude smelt-backend-duckdb
          --exclude smelt-datagen
          --exclude smelt-cli
          --exclude smelt-bench
          --lib --bins --tests
          -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: cd ui && npm ci && npm run build

      - name: Run unit tests
        run: cargo test --lib

      - name: Run property-based tests (quick)
        run: cargo test --test proptest_round_trip -- --test-threads=1
        env:
          PROPTEST_CASES: 100

      - name: Run PostgreSQL compatibility tests (quick)
        run: cargo test -p smelt-parser-compat --test parse_equivalence -- --test-threads=1
        env:
          PROPTEST_CASES: 100

  fuzz-build:
    name: Fuzz Targets Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache fuzz build
        uses: actions/cache@v4
        with:
          path: crates/smelt-parser/fuzz/target
          key: ${{ runner.os }}-fuzz-build-${{ hashFiles('crates/smelt-parser/fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Build fuzz targets
        run: |
          cd crates/smelt-parser
          cargo +nightly fuzz build
