name: Docs PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs-site/**"
      - "README.md"
      - "docs/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Forked PRs get a read-only GITHUB_TOKEN on public repos, so publishing
    # would fail here anyway; skip rather than show a red X.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW_PATH: branches/pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://smeltsql.com/branches/pr-${{ github.event.pull_request.number }}/
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build site
        working-directory: docs-site
        run: uv run mkdocs build --strict

      - name: Publish to gh-pages (PR subdirectory)
        uses: ./.github/actions/publish-docs
        with:
          source-dir: docs-site/site
          target-dir: ${{ env.PREVIEW_PATH }}
          commit-message: "docs: preview for PR #${{ github.event.pull_request.number }} (${{ github.sha }})"

      - name: Comment preview link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- docs-preview-comment -->";
            const body = `${marker}\n📄 Docs preview: ${process.env.PREVIEW_URL}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
