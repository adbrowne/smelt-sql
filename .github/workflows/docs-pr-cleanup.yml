name: Docs PR Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  remove-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Remove PR preview directory from gh-pages
        run: |
          set -euo pipefail
          PR_DIR="branches/pr-${{ github.event.pull_request.number }}"

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch does not exist yet, nothing to clean up"
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            WORKTREE=$(mktemp -d)
            git fetch origin gh-pages
            git worktree add "$WORKTREE" origin/gh-pages
            (cd "$WORKTREE" && git checkout -B gh-pages)

            if [ ! -d "$WORKTREE/$PR_DIR" ]; then
              echo "No preview directory at $PR_DIR, nothing to clean up"
              git worktree remove "$WORKTREE" --force
              exit 0
            fi

            rm -rf "$WORKTREE/$PR_DIR"
            pushd "$WORKTREE" >/dev/null
            git add -A
            git commit -q -m "docs: remove preview for PR #${{ github.event.pull_request.number }}"
            if git push origin gh-pages; then
              popd >/dev/null
              git worktree remove "$WORKTREE" --force
              exit 0
            fi
            popd >/dev/null
            git worktree remove "$WORKTREE" --force
            echo "Push rejected (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

          echo "Failed to push cleanup to gh-pages after retries" >&2
          exit 1

      - name: Note cleanup on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- docs-preview-comment -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n📄 Docs preview closed (PR merged/closed).`,
              });
            }
