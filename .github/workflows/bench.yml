name: Benchmarks

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks and save results
        run: cargo run -p smelt-bench --bin save-results --release

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: benchmarks/results/*.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate charts
        run: |
          pip install -r benchmarks/charts/requirements.txt
          python benchmarks/charts/generate_charts.py benchmarks/results/ --output benchmarks/charts/output/

      - name: Upload charts
        uses: actions/upload-artifact@v4
        with:
          name: bench-charts-${{ github.sha }}
          path: benchmarks/charts/output/*.png
