name: Parser Compatibility

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 3am UTC for extended tests
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Spark/Trino-relevant changes
    runs-on: ubuntu-latest
    outputs:
      spark: ${{ steps.filter.outputs.spark }}
      trino: ${{ steps.filter.outputs.trino }}
    steps:
      # Skipped on schedule: github.event.before is unset for schedule events, so the
      # base-ref fallback below resolves to the literal string 'HEAD~1', which
      # paths-filter cannot fetch as a remote refspec. Downstream spark/trino jobs
      # already run unconditionally on schedule (github.event_name == 'schedule'), so
      # this job's output isn't needed on that trigger.
      - name: Checkout code
        if: github.event_name != 'schedule'
        uses: actions/checkout@v6

      - name: Filter paths
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          filters: |
            spark:
              - 'crates/smelt-backend-spark/**'
              - 'crates/smelt-logical/**'
              - 'crates/smelt-runtime/**'
              - 'crates/smelt-cli/tests/*parity*'
              - 'crates/smelt-types/src/signatures.rs'
              - 'crates/smelt-dialect/**'
              - 'crates/smelt-oracle-testkit/**'
              - 'crates/smelt-db/tests/dialect_audit/**'
              - 'crates/smelt-db/src/type_inference*/**'
              - 'crates/smelt-parser/src/**'
              - 'python/**'
              - 'scripts/spark-*.sh'
              - '.github/workflows/compat.yml'
            trino:
              - 'crates/smelt-backend-trino/**'
              - 'crates/smelt-backends/**'
              - 'crates/smelt-cli/tests/trino_*'
              - 'crates/smelt-cli/tests/maintenance_conformance_trino/**'
              - 'crates/smelt-maintenance-testkit/**'
              - 'crates/smelt-cli/tests/common/**'
              - 'crates/smelt-runtime/**'
              - 'crates/smelt-dialect/**'
              - 'crates/smelt-db/tests/dialect_audit/**'
              - 'crates/smelt-oracle-testkit/**'
              - 'crates/smelt-types/**'
              - '.claude/dialect-gaps-baseline.txt'
              - 'examples/trino_spine/**'
              - 'scripts/trino-*'
              - 'scripts/trino-catalog/**'
              - 'scripts/README-trino.md'
              - '.github/workflows/compat.yml'

  parse-equivalence:
    name: Parse Equivalence Tests (PG + Spark)
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-${{ hashFiles('**/Cargo.lock') }}

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run parse equivalence tests (500 cases, pg_query + sqlparser-databricks)
        run: cargo test -p smelt-parser-compat --test parse_equivalence
        env:
          PROPTEST_CASES: 500

      - name: Run known gaps tests (PG + Spark)
        run: cargo test -p smelt-parser-compat --test known_gaps

  sqlglot-validation:
    name: sqlglot Validation
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install sqlglot
        run: pip install sqlglot

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-${{ hashFiles('**/Cargo.lock') }}

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run tests with sqlglot validation
        run: cargo test -p smelt-parser-compat
        env:
          SQLGLOT_AVAILABLE: "1"

  parse-equivalence-extended:
    name: Extended Parse Equivalence (Nightly)
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib
    # Only run on schedule (nightly) or when explicitly labeled
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-extended-tests')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-${{ hashFiles('**/Cargo.lock') }}

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run extended parse equivalence tests (2000 cases)
        run: cargo test -p smelt-parser-compat --test parse_equivalence
        env:
          PROPTEST_CASES: 2000

  type-checking:
    name: Type Checking Tests (PostgreSQL Docker)
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib
    # Only run when specifically requested or on schedule
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests')

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-docker-${{ hashFiles('**/Cargo.lock') }}

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run type checking tests
        run: cargo test -p smelt-parser-compat --test type_checking -- --ignored
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

  spark-integration:
    name: Spark SQL Integration Tests (Docker)
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib
    # Only run on schedule (nightly) or when explicitly labeled
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-spark-${{ hashFiles('**/Cargo.lock') }}

      - name: Pull Spark Docker image (apache/spark:4.0.0)
        run: docker pull apache/spark:4.0.0

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run Spark integration tests
        run: cargo test -p smelt-parser-compat --test spark_integration -- --ignored

  type-property-spark:
    name: Type Property Tests (DuckDB + Spark)
    runs-on: ubuntu-latest
    needs: changes
    # Run on schedule (nightly), when explicitly labeled, or when this PR/push
    # touches Spark-relevant paths (type-inference, signature registry, dialect
    # surface, backend crate)
    # !cancelled() guards against a `changes`-job failure silently skipping this
    # job on nightly/labeled runs (a needed job's failure skips dependents unless
    # the if: carries a status-check function).
    if: ${{ !cancelled() && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests') || needs.changes.outputs.spark == 'true') }}

    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-type-prop-spark-${{ hashFiles('**/Cargo.lock') }}

      - name: Pull Spark Docker image (apache/spark:4.0.0)
        run: docker pull apache/spark:4.0.0

      - name: Start Spark container
        run: |
          docker run -d --name spark-type-test apache/spark:4.0.0 tail -f /dev/null
          echo "SPARK_CONTAINER_ID=spark-type-test" >> $GITHUB_ENV

      - name: Build smelt-db
        run: cargo build -p smelt-db

      - name: Run type property tests (DuckDB + Spark)
        run: cargo test -p smelt-db --no-default-features --test type_property_tests
        env:
          SPARK_CONTAINER_ID: spark-type-test
          PROPTEST_CASES: 500

      - name: Cleanup Spark container
        if: always()
        run: docker rm -f spark-type-test

  dialect-audit-spark:
    name: Dialect Emission Audit (Spark legs)
    runs-on: ubuntu-latest
    needs: changes
    # Same gate as type-property-spark: nightly, explicitly labelled, or a
    # push/PR touching the registry, the printer, or the audit itself.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests') || needs.changes.outputs.spark == 'true') }}

    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dialect-audit-spark-${{ hashFiles('**/Cargo.lock') }}

      - name: Pull Spark Docker image (apache/spark:4.0.0)
        run: docker pull apache/spark:4.0.0

      - name: Start Spark container
        run: |
          docker run -d --name spark-dialect-audit apache/spark:4.0.0 tail -f /dev/null
          echo "SPARK_CONTAINER_ID=spark-dialect-audit" >> $GITHUB_ENV

      - name: Build smelt-db
        run: cargo build -p smelt-db

      - name: Run the dialect audit (DuckDB + Spark legs)
        run: cargo test -p smelt-db --no-default-features --test dialect_audit
        env:
          SPARK_CONTAINER_ID: spark-dialect-audit

      - name: Cleanup Spark container
        if: always()
        run: docker rm -f spark-dialect-audit

  spark-parity:
    name: Spark Parity Tests (Delta, Docker)
    runs-on: ubuntu-latest
    needs: changes
    # Run on schedule (nightly), when explicitly labeled, or when this PR/push
    # touches Spark-relevant paths (backend crate, parity tests, type
    # inference, signature registry, dialect surface)
    # !cancelled() guards against a `changes`-job failure silently skipping this
    # job on nightly/labeled runs (a needed job's failure skips dependents unless
    # the if: carries a status-check function).
    if: ${{ !cancelled() && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests') || needs.changes.outputs.spark == 'true') }}

    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pyspark client (pinned 4.0.0)
        run: |
          python -m venv --without-pip .smelt-spark-venv
          curl -sL https://bootstrap.pypa.io/get-pip.py | .smelt-spark-venv/bin/python
          .smelt-spark-venv/bin/pip install 'pyspark[connect]==4.0.0' pandas pyarrow grpcio grpcio-status protobuf

      - name: Cache Spark Ivy (Delta jars — only downloaded once per version)
        uses: actions/cache@v5
        with:
          path: .smelt-spark-ivy
          key: spark-ivy-delta-4.0.0

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-spark-parity-${{ hashFiles('**/Cargo.lock') }}

      - name: Pull Spark Docker image (apache/spark:4.0.0)
        run: docker pull apache/spark:4.0.0

      - name: Start Delta-enabled Spark Connect
        run: |
          bash scripts/spark-up.sh
          echo "SPARK_CONNECT_URL=sc://localhost:15002" >> $GITHUB_ENV
          echo "SMELT_SPARK_WAREHOUSE=${GITHUB_WORKSPACE}/.smelt-spark-warehouse" >> $GITHUB_ENV
          _venv="${GITHUB_WORKSPACE}/.smelt-spark-venv/lib/python3.12/site-packages"
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/python:${_venv}" >> $GITHUB_ENV
          echo "PYSPARK_PYTHON=${GITHUB_WORKSPACE}/.smelt-spark-venv/bin/python" >> $GITHUB_ENV

      - name: Build parity test suite (spark feature)
        run: cargo build -p smelt-cli --features smelt-cli/spark

      - name: Run Spark backend integration tests (delta smoke + DDL)
        run: cargo test -p smelt-backend-spark --quiet 2>&1 | tail -40

      - name: Run Spark parity suite (dual-target + CLI integration)
        run: cargo test -p smelt-cli --features smelt-cli/spark --quiet 2>&1 | tail -40

      - name: Stop Spark Connect
        if: always()
        run: bash scripts/spark-down.sh

  trino-integration:
    name: Trino/Iceberg Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: changes
    # Run on schedule (nightly), when explicitly labeled, or when this PR/push
    # touches Trino-relevant paths (backend crate, parity tests, dialect
    # surface, the compose tier itself).
    # !cancelled() guards against a `changes`-job failure silently skipping this
    # job on nightly/labeled runs (a needed job's failure skips dependents unless
    # the if: carries a status-check function).
    if: ${{ !cancelled() && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests') || needs.changes.outputs.trino == 'true') }}

    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-trino-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Start Trino/Iceberg/MinIO tier
        run: |
          bash scripts/trino-up.sh
          source scripts/trino-env.sh
          {
            echo "SMELT_TRINO_URL=${SMELT_TRINO_URL}"
            echo "SMELT_TRINO_USER=${SMELT_TRINO_USER}"
            echo "SMELT_TRINO_CATALOG=${SMELT_TRINO_CATALOG}"
            echo "SMELT_TRINO_SCHEMA=${SMELT_TRINO_SCHEMA}"
          } >> "$GITHUB_ENV"

      # No pyspark/venv/Ivy steps here — Trino is pure Rust HTTP, which is the point.
      - name: Run smelt-backend-trino test suite (stub + live legs)
        run: |
          set -o pipefail
          cargo test -p smelt-backend-trino --quiet 2>&1 | tee trino-backend-test.log | tail -60
          if grep -qi skipping trino-backend-test.log; then
            echo "::error::a Trino leg in smelt-backend-trino skipped with the tier up — SMELT_TRINO_URL should be set in this job"
            exit 1
          fi

      - name: Run Trino CLI parity legs
        run: |
          set -o pipefail
          cargo test -p smelt-cli --test trino_smoke --test seed_parity --test materialization_parity --test trino_ddl_live --test trino_state_residency --test trino_lock_versioning --test trino_incremental_families --quiet 2>&1 | tee trino-cli-test.log | tail -60
          if grep -qi skipping trino-cli-test.log; then
            echo "::error::a Trino leg in smelt-cli skipped with the tier up — SMELT_TRINO_URL should be set in this job"
            exit 1
          fi

      - name: Run smelt-runtime statement_parity Trino leg
        run: |
          set -o pipefail
          cargo test -p smelt-runtime --test statement_parity --quiet 2>&1 | tee trino-runtime-test.log | tail -60
          if grep -qi skipping trino-runtime-test.log; then
            echo "::error::the Trino leg in smelt-runtime's statement_parity skipped with the tier up — SMELT_TRINO_URL should be set in this job"
            exit 1
          fi

      # The dialect_audit binary also carries Spark and BigQuery legs, which
      # legitimately skip green with no session/credential in this job — the
      # check is deliberately narrow to `schema_leg_trino` rather than a bare
      # `skipping`, unlike the two steps above (which run no other dialect's
      # legs and can afford the broad check).
      - name: Run the dialect_audit Trino schema leg
        run: |
          set -o pipefail
          cargo test -p smelt-db --test dialect_audit --quiet 2>&1 | tee dialect-audit-test.log | tail -60
          if grep -q "skipping schema_leg_trino" dialect-audit-test.log; then
            echo "::error::schema_leg_trino skipped with the tier up — SMELT_TRINO_URL should be set in this job"
            exit 1
          fi

      - name: Stop Trino/Iceberg/MinIO tier
        if: always()
        run: bash scripts/trino-down.sh

  maintenance-conformance-spark:
    name: Maintenance Conformance Spark Twin (Delta, Docker)
    runs-on: ubuntu-latest
    needs: changes
    # Same trigger discipline as spark-parity: nightly, explicitly labeled, or
    # when this PR/push touches Spark-relevant paths. Gated tier only — the
    # generative recipe pool over Spark Connect is too slow for per-PR runs.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests') || needs.changes.outputs.spark == 'true') }}

    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pyspark client (pinned 4.0.0)
        run: |
          python -m venv --without-pip .smelt-spark-venv
          curl -sL https://bootstrap.pypa.io/get-pip.py | .smelt-spark-venv/bin/python
          .smelt-spark-venv/bin/pip install 'pyspark[connect]==4.0.0' pandas pyarrow grpcio grpcio-status protobuf

      - name: Cache Spark Ivy (Delta jars — only downloaded once per version)
        uses: actions/cache@v5
        with:
          path: .smelt-spark-ivy
          key: spark-ivy-delta-4.0.0

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-maintenance-conformance-spark-${{ hashFiles('**/Cargo.lock') }}

      - name: Pull Spark Docker image (apache/spark:4.0.0)
        run: docker pull apache/spark:4.0.0

      - name: Start Delta-enabled Spark Connect
        run: |
          bash scripts/spark-up.sh
          echo "SPARK_CONNECT_URL=sc://localhost:15002" >> $GITHUB_ENV
          echo "SMELT_SPARK_WAREHOUSE=${GITHUB_WORKSPACE}/.smelt-spark-warehouse" >> $GITHUB_ENV
          _venv="${GITHUB_WORKSPACE}/.smelt-spark-venv/lib/python3.12/site-packages"
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/python:${_venv}" >> $GITHUB_ENV
          echo "PYSPARK_PYTHON=${GITHUB_WORKSPACE}/.smelt-spark-venv/bin/python" >> $GITHUB_ENV

      - name: Build maintenance-conformance Spark twin (spark feature)
        run: cargo build -p smelt-cli --features smelt-cli/spark --test maintenance_conformance_spark

      - name: Run maintenance-conformance Spark twin (reduced sample, single-threaded)
        run: cargo test -p smelt-cli --features smelt-cli/spark --test maintenance_conformance_spark -- --test-threads=1 2>&1 | tail -60

      - name: Stop Spark Connect
        if: always()
        run: bash scripts/spark-down.sh

  maintenance-conformance-trino:
    name: Maintenance Conformance Trino Twin (Iceberg, Docker)
    runs-on: ubuntu-latest
    needs: changes
    # Same trigger discipline as trino-integration/maintenance-conformance-spark:
    # nightly, explicitly labeled, or when this PR/push touches Trino-relevant
    # paths. Gated tier only — the generative recipe pool over a live Trino
    # coordinator is too slow for per-PR runs.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests') || needs.changes.outputs.trino == 'true') }}

    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-maintenance-conformance-trino-${{ hashFiles('**/Cargo.lock') }}

      - name: Start Trino/Iceberg/MinIO tier
        run: |
          bash scripts/trino-up.sh
          source scripts/trino-env.sh
          {
            echo "SMELT_TRINO_URL=${SMELT_TRINO_URL}"
            echo "SMELT_TRINO_USER=${SMELT_TRINO_USER}"
            echo "SMELT_TRINO_CATALOG=${SMELT_TRINO_CATALOG}"
          } >> "$GITHUB_ENV"

      - name: Run maintenance-conformance Trino twin (reduced sample, single-threaded)
        run: |
          set -o pipefail
          cargo test -p smelt-cli --test maintenance_conformance_trino -- --test-threads=1 2>&1 | tee trino-conformance-test.log | tail -60
          if grep -qi skipping trino-conformance-test.log; then
            echo "::error::a Trino leg in maintenance_conformance_trino skipped with the tier up — SMELT_TRINO_URL should be set in this job"
            exit 1
          fi

      - name: Stop Trino/Iceberg/MinIO tier
        if: always()
        run: bash scripts/trino-down.sh

  maintenance-conformance-soak:
    name: Maintenance Conformance Soak (Nightly, deep sample)
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib
    # Only run on schedule (nightly) or when explicitly labeled — the
    # standing gate itself (small deterministic sample) already runs on
    # every `cargo test`; this job re-runs it at a much deeper sample depth
    # to catch a shrinkable counterexample the default depth misses.
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-extended-tests')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-maintenance-conformance-soak-${{ hashFiles('**/Cargo.lock') }}

      - name: Run maintenance-conformance gate at deep sample depth (200 cases)
        run: cargo test -p smelt-cli --test maintenance_conformance --features duckdb --quiet 2>&1 | tail -60
        env:
          SMELT_CONFORMANCE_CASES: 200

  gap-report:
    name: Generate Gap Report
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Setup mise (rust, node)
        uses: jdx/mise-action@v2

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-${{ hashFiles('**/Cargo.lock') }}

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run gap summary test
        run: cargo test -p smelt-parser-compat --test known_gaps test_gap_summary -- --nocapture

      - name: Run gap tests and capture output
        run: |
          echo "## Parser Gap Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated on $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cargo test -p smelt-parser-compat --test known_gaps test_gap_summary -- --nocapture 2>&1 | tee gap_output.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat gap_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
