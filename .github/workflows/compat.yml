name: Parser Compatibility

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 3am UTC for extended tests
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Spark-relevant changes
    runs-on: ubuntu-latest
    outputs:
      spark: ${{ steps.filter.outputs.spark }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1') }}
          filters: |
            spark:
              - 'crates/smelt-backend-spark/**'
              - 'crates/smelt-logical/**'
              - 'crates/smelt-runtime/**'
              - 'crates/smelt-cli/tests/*parity*'
              - 'crates/smelt-types/src/signatures.rs'
              - 'crates/smelt-db/src/type_inference*/**'
              - 'crates/smelt-parser/src/**'
              - 'python/**'
              - 'scripts/spark-*.sh'
              - '.github/workflows/compat.yml'

  parse-equivalence:
    name: Parse Equivalence Tests (PG + Spark)
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-${{ hashFiles('**/Cargo.lock') }}

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run parse equivalence tests (500 cases, pg_query + sqlparser-databricks)
        run: cargo test -p smelt-parser-compat --test parse_equivalence
        env:
          PROPTEST_CASES: 500

      - name: Run known gaps tests (PG + Spark)
        run: cargo test -p smelt-parser-compat --test known_gaps

  sqlglot-validation:
    name: sqlglot Validation
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install sqlglot
        run: pip install sqlglot

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-${{ hashFiles('**/Cargo.lock') }}

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run tests with sqlglot validation
        run: cargo test -p smelt-parser-compat
        env:
          SQLGLOT_AVAILABLE: "1"

  parse-equivalence-extended:
    name: Extended Parse Equivalence (Nightly)
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib
    # Only run on schedule (nightly) or when explicitly labeled
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-extended-tests')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-${{ hashFiles('**/Cargo.lock') }}

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run extended parse equivalence tests (2000 cases)
        run: cargo test -p smelt-parser-compat --test parse_equivalence
        env:
          PROPTEST_CASES: 2000

  type-checking:
    name: Type Checking Tests (PostgreSQL Docker)
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib
    # Only run when specifically requested or on schedule
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests')

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-docker-${{ hashFiles('**/Cargo.lock') }}

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run type checking tests
        run: cargo test -p smelt-parser-compat --test type_checking -- --ignored
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

  spark-integration:
    name: Spark SQL Integration Tests (Docker)
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib
    # Only run on schedule (nightly) or when explicitly labeled
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-spark-${{ hashFiles('**/Cargo.lock') }}

      - name: Pull Spark Docker image
        run: docker pull apache/spark:latest

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run Spark integration tests
        run: cargo test -p smelt-parser-compat --test spark_integration -- --ignored

  type-property-spark:
    name: Type Property Tests (DuckDB + Spark)
    runs-on: ubuntu-latest
    needs: changes
    # Run on schedule (nightly), when explicitly labeled, or when this PR/push
    # touches Spark-relevant paths (type-inference, signature registry, dialect
    # surface, backend crate)
    # !cancelled() guards against a `changes`-job failure silently skipping this
    # job on nightly/labeled runs (a needed job's failure skips dependents unless
    # the if: carries a status-check function).
    if: ${{ !cancelled() && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests') || needs.changes.outputs.spark == 'true') }}

    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-type-prop-spark-${{ hashFiles('**/Cargo.lock') }}

      - name: Pull Spark Docker image
        run: docker pull apache/spark:latest

      - name: Start Spark container
        run: |
          docker run -d --name spark-type-test apache/spark:latest tail -f /dev/null
          echo "SPARK_CONTAINER_ID=spark-type-test" >> $GITHUB_ENV

      - name: Build smelt-db
        run: cargo build -p smelt-db

      - name: Run type property tests (DuckDB + Spark)
        run: cargo test -p smelt-db --no-default-features --test type_property_tests
        env:
          SPARK_CONTAINER_ID: spark-type-test
          PROPTEST_CASES: 500

      - name: Cleanup Spark container
        if: always()
        run: docker rm -f spark-type-test

  spark-parity:
    name: Spark Parity Tests (Delta, Docker)
    runs-on: ubuntu-latest
    needs: changes
    # Run on schedule (nightly), when explicitly labeled, or when this PR/push
    # touches Spark-relevant paths (backend crate, parity tests, type
    # inference, signature registry, dialect surface)
    # !cancelled() guards against a `changes`-job failure silently skipping this
    # job on nightly/labeled runs (a needed job's failure skips dependents unless
    # the if: carries a status-check function).
    if: ${{ !cancelled() && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests') || needs.changes.outputs.spark == 'true') }}

    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pyspark client (pinned 4.0.0)
        run: |
          python -m venv --without-pip .smelt-spark-venv
          curl -sL https://bootstrap.pypa.io/get-pip.py | .smelt-spark-venv/bin/python
          .smelt-spark-venv/bin/pip install 'pyspark[connect]==4.0.0' pandas pyarrow grpcio grpcio-status protobuf

      - name: Cache Spark Ivy (Delta jars — only downloaded once per version)
        uses: actions/cache@v5
        with:
          path: .smelt-spark-ivy
          key: spark-ivy-delta-4.0.0

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-spark-parity-${{ hashFiles('**/Cargo.lock') }}

      - name: Pull Spark Docker image (apache/spark:4.0.0)
        run: docker pull apache/spark:4.0.0

      - name: Start Delta-enabled Spark Connect
        run: |
          bash scripts/spark-up.sh
          echo "SPARK_CONNECT_URL=sc://localhost:15002" >> $GITHUB_ENV
          echo "SMELT_SPARK_WAREHOUSE=${GITHUB_WORKSPACE}/.smelt-spark-warehouse" >> $GITHUB_ENV
          _venv="${GITHUB_WORKSPACE}/.smelt-spark-venv/lib/python3.12/site-packages"
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/python:${_venv}" >> $GITHUB_ENV
          echo "PYSPARK_PYTHON=${GITHUB_WORKSPACE}/.smelt-spark-venv/bin/python" >> $GITHUB_ENV

      - name: Build parity test suite (spark feature)
        run: cargo build -p smelt-cli --features smelt-cli/spark

      - name: Run Spark backend integration tests (delta smoke + DDL)
        run: cargo test -p smelt-backend-spark --quiet 2>&1 | tail -40

      - name: Run Spark parity suite (dual-target + CLI integration)
        run: cargo test -p smelt-cli --features smelt-cli/spark --quiet 2>&1 | tail -40

      - name: Stop Spark Connect
        if: always()
        run: bash scripts/spark-down.sh

  maintenance-conformance-spark:
    name: Maintenance Conformance Spark Twin (Delta, Docker)
    runs-on: ubuntu-latest
    needs: changes
    # Same trigger discipline as spark-parity: nightly, explicitly labeled, or
    # when this PR/push touches Spark-relevant paths. Gated tier only — the
    # generative recipe pool over Spark Connect is too slow for per-PR runs.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-docker-tests') || needs.changes.outputs.spark == 'true') }}

    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pyspark client (pinned 4.0.0)
        run: |
          python -m venv --without-pip .smelt-spark-venv
          curl -sL https://bootstrap.pypa.io/get-pip.py | .smelt-spark-venv/bin/python
          .smelt-spark-venv/bin/pip install 'pyspark[connect]==4.0.0' pandas pyarrow grpcio grpcio-status protobuf

      - name: Cache Spark Ivy (Delta jars — only downloaded once per version)
        uses: actions/cache@v5
        with:
          path: .smelt-spark-ivy
          key: spark-ivy-delta-4.0.0

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-maintenance-conformance-spark-${{ hashFiles('**/Cargo.lock') }}

      - name: Pull Spark Docker image (apache/spark:4.0.0)
        run: docker pull apache/spark:4.0.0

      - name: Start Delta-enabled Spark Connect
        run: |
          bash scripts/spark-up.sh
          echo "SPARK_CONNECT_URL=sc://localhost:15002" >> $GITHUB_ENV
          echo "SMELT_SPARK_WAREHOUSE=${GITHUB_WORKSPACE}/.smelt-spark-warehouse" >> $GITHUB_ENV
          _venv="${GITHUB_WORKSPACE}/.smelt-spark-venv/lib/python3.12/site-packages"
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/python:${_venv}" >> $GITHUB_ENV
          echo "PYSPARK_PYTHON=${GITHUB_WORKSPACE}/.smelt-spark-venv/bin/python" >> $GITHUB_ENV

      - name: Build maintenance-conformance Spark twin (spark feature)
        run: cargo build -p smelt-cli --features smelt-cli/spark --test maintenance_conformance_spark

      - name: Run maintenance-conformance Spark twin (reduced sample, single-threaded)
        run: cargo test -p smelt-cli --features smelt-cli/spark --test maintenance_conformance_spark -- --test-threads=1 2>&1 | tail -60

      - name: Stop Spark Connect
        if: always()
        run: bash scripts/spark-down.sh

  maintenance-conformance-soak:
    name: Maintenance Conformance Soak (Nightly, deep sample)
    runs-on: ubuntu-latest
    env:
      DUCKDB_LIB_DIR: /usr/local/lib
    # Only run on schedule (nightly) or when explicitly labeled — the
    # standing gate itself (small deterministic sample) already runs on
    # every `cargo test`; this job re-runs it at a much deeper sample depth
    # to catch a shrinkable counterexample the default depth misses.
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-extended-tests')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-maintenance-conformance-soak-${{ hashFiles('**/Cargo.lock') }}

      - name: Run maintenance-conformance gate at deep sample depth (200 cases)
        run: cargo test -p smelt-cli --test maintenance_conformance --features duckdb --quiet 2>&1 | tail -60
        env:
          SMELT_CONFORMANCE_CASES: 200

  gap-report:
    name: Generate Gap Report
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DUCKDB_LIB_DIR: /usr/local/lib

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup DuckDB system library
        uses: ./.github/actions/setup-duckdb

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-${{ hashFiles('**/Cargo.lock') }}

      - name: Build smelt-parser-compat
        run: cargo build -p smelt-parser-compat

      - name: Run gap summary test
        run: cargo test -p smelt-parser-compat --test known_gaps test_gap_summary -- --nocapture

      - name: Run gap tests and capture output
        run: |
          echo "## Parser Gap Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated on $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cargo test -p smelt-parser-compat --test known_gaps test_gap_summary -- --nocapture 2>&1 | tee gap_output.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat gap_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
