name: Setup DuckDB System Library
description: Install DuckDB shared library for linking without bundled compilation

inputs:
  version:
    description: DuckDB version to install
    required: false
    default: "v1.5.0"

runs:
  using: composite
  steps:
    - name: Cache DuckDB library
      id: cache-duckdb
      uses: actions/cache@v5
      with:
        path: /usr/local/lib/libduckdb*
        key: duckdb-lib-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install DuckDB library
      if: steps.cache-duckdb.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -sL "https://github.com/duckdb/duckdb/releases/download/${{ inputs.version }}/libduckdb-linux-amd64.zip" -o /tmp/libduckdb.zip
        cd /tmp && unzip -o libduckdb.zip libduckdb.so
        sudo cp /tmp/libduckdb.so /usr/local/lib/
        sudo ldconfig
