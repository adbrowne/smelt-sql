[package]
name = "smelt-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Web server
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }

# Embedded assets
rust-embed = "8"
mime_guess = "2"

# Async runtime
tokio.workspace = true

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow.workspace = true
