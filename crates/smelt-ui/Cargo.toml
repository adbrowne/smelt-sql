[package]
name = "smelt-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
# Core smelt dependencies
smelt-core = { path = "../smelt-core" }
smelt-db = { path = "../smelt-db" }
smelt-planner = { path = "../smelt-planner" }
smelt-backend = { path = "../smelt-backend" }
smelt-backends = { path = "../smelt-backends" }
smelt-state = { path = "../smelt-state" }
smelt-parser = { path = "../smelt-parser" }
smelt-dialect = { path = "../smelt-dialect" }
smelt-logical = { path = "../smelt-logical" }
smelt-runtime = { path = "../smelt-runtime" }

# Web server
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Embedded assets
rust-embed = "8"
mime_guess = "2"

# Async runtime
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }

# File watching
notify-debouncer-mini = "0.7"

# Date handling
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow.workspace = true

# CST types (for TextRange in tests)
rowan.workspace = true

# Byte-offset → line/column at the UI JSON boundary
line-index.workspace = true

# Logging
tracing = "0.1"

[features]
default = ["duckdb"]
duckdb = ["smelt-backends/duckdb"]
spark = ["smelt-backends/spark"]
bundled-duckdb = ["smelt-backends/bundled-duckdb"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
urlencoding = "2"
