[package]
name = "smelt-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
salsa.workspace = true
anyhow.workspace = true
rowan.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"
marked-yaml = "0.8"
smelt-core = { path = "../smelt-core" }
smelt-logical = { path = "../smelt-logical" }
smelt-parser = { path = "../smelt-parser" }
smelt-types = { path = "../smelt-types" }
walkdir = "2"
line-index.workspace = true

[dev-dependencies]
duckdb = { workspace = true }
arrow = { workspace = true }
proptest = { workspace = true }
smelt-dialect = { path = "../smelt-dialect" }
smelt-runtime = { path = "../smelt-runtime" }
smelt-backend = { path = "../smelt-backend" }
smelt-backend-duckdb = { path = "../smelt-backend-duckdb" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

[features]
default = []
bundled-duckdb = ["duckdb/bundled"]
