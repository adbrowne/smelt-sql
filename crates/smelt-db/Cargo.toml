[package]
name = "smelt-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
salsa.workspace = true
anyhow.workspace = true
rowan.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"
marked-yaml = "0.8"
smelt-core = { path = "../smelt-core" }
smelt-logical = { path = "../smelt-logical" }
smelt-parser = { path = "../smelt-parser" }
smelt-types = { path = "../smelt-types" }
# Backend-name → BackendCapabilities lookup for `maintenance.cells[].write`
# pin validation (`queries/maintenance.rs::backend_write_capabilities_for`) —
# a real (non-dev) dependency now, not just for test fixtures.
smelt-dialect = { path = "../smelt-dialect" }
walkdir = "2"
line-index.workspace = true
tracing.workspace = true

[dev-dependencies]
duckdb = { workspace = true }
arrow = { workspace = true }
proptest = { workspace = true }
smelt-runtime = { path = "../smelt-runtime" }
tempfile = "3"

[features]
default = []
bundled-duckdb = ["duckdb/bundled"]
