[package]
name = "smelt-parser-compat"
version.workspace = true
edition.workspace = true
description = "PostgreSQL compatibility testing for smelt-parser"
license.workspace = true
publish = false

[dependencies]
smelt-parser = { path = "../smelt-parser" }
smelt-types = { path = "../smelt-types" }
pg_query = "6.1"              # PostgreSQL parser (vendored libpg_query)
sqlparser = "0.61"            # SQL parser with Databricks dialect (Spark-compatible)
regex = "1"                   # For pattern matching in gap detection
proptest = "1.4"              # Property-based testing strategies
duckdb = { workspace = true } # In-memory DuckDB execution oracle for differential parsing (system-lib mode)

[dev-dependencies]
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"        # PostgreSQL client for type checking
rand = "0.8"                  # For SQL generation
