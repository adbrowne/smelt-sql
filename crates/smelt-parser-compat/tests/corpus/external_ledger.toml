# External-corpus failure ledger — architecture spec §Constraints #13
# "corpus grounding". Keyed by a stable hash of the normalized statement
# (see `stmt_hash` in tests/external_corpus.rs — FNV-1a 64-bit over the
# exact corpus line's UTF-8 bytes, a frozen algorithm stable across runs,
# machines, and Rust toolchain releases). Each entry
# records a `category` (reusing crates/smelt-parser-compat/src/gaps.rs
# vocabulary where a gap corresponds to an existing registry entry) and a
# free-text `note`.
#
# Provenance: this ledger was populated by running
# `cargo test -p smelt-parser-compat --test external_corpus` against the
# corpus vendored under tests/corpus/external/ and bucketing every failure
# by pattern-matching its SQL text against a small set of known DuckDB/
# PostgreSQL grammar-gap signatures (dollar-quoted strings, MAP literals,
# full-text search operators, window-frame EXCLUDE clauses, and so on —
# many of these signatures already exist as smelt-fails gaps.rs entries).
# A large residual of failures did not match a known signature; those are
# recorded under `category = "smelt_fails_unclassified"` with the actual
# first smelt parser error message as the note — an honest, mechanically
# derived diagnostic rather than a guessed root cause, given the sheer
# grammar-surface diversity these upstream test suites intentionally probe.
# NONE of these gaps are fixed by this phase; fixing is follow-on work
# sized by these ledger counts (see architecture.md Known Divergences and
# the plan's "Explicitly deferred" section).
#
# Shrink-only pressure: `ledger_has_no_stale_entries` in
# tests/external_corpus.rs fails the build if a listed statement now passes
# or no longer matches any corpus statement — remove the entry then.

