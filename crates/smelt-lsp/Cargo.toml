[package]
name = "smelt-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "smelt_lsp"
path = "src/lib.rs"

[[bin]]
name = "smelt-lsp"
path = "src/main.rs"

[dependencies]
smelt-core = { path = "../smelt-core" }
smelt-db = { path = "../smelt-db" }
smelt-parser = { path = "../smelt-parser" }
smelt-types = { path = "../smelt-types" }
# Property-diff editor integration (`docs/specs/property_diff.md` §Surface
# "Editor"): profile assembly lives in `smelt-runtime`
# (`profiles_for_workspace` carries the probe plan `smelt-db` cannot own),
# and the diff/render primitives live in `smelt-logical`. Acyclic:
# `smelt-runtime` never depends on `smelt-lsp`, and its heaviest deps
# (`smelt-backend`, `smelt-state`) link no DuckDB — that dependency is
# `smelt-runtime`'s dev-only.
smelt-runtime = { path = "../smelt-runtime" }
smelt-logical = { path = "../smelt-logical" }

tower-lsp.workspace = true
lsp-types.workspace = true
tokio.workspace = true
anyhow.workspace = true

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.4"
pyo3 = { workspace = true, optional = true }
line-index.workspace = true
rowan.workspace = true

[features]
default = ["python"]
python = ["smelt-core/python", "smelt-runtime/python", "pyo3"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1.0"
tower-lsp = "0.20"
smelt-state = { path = "../smelt-state" }
chrono = { workspace = true }
lsp-types = "0.94"
