[package]
name = "smelt-backend-bigquery"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "BigQuery backend implementation for smelt via google-cloud-bigquery/PyO3 bridge"

[dependencies]
# Backend trait
smelt-backend = { path = "../smelt-backend" }

# Arrow (with pyarrow feature for zero-copy conversion)
arrow = { workspace = true, features = ["pyarrow"] }

# Python bridge
pyo3 = { workspace = true }

# Async runtime
tokio.workspace = true
async-trait = "0.1"

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

[dev-dependencies]
smelt-dialect = { path = "../smelt-dialect" }
# Drives the never-fold-twice test with the REAL ledger builders rather than
# a restatement of them. Dev-only: the production backend receives its ledger
# SQL from the caller and depends on `smelt-state` not at all.
smelt-state = { path = "../smelt-state" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
