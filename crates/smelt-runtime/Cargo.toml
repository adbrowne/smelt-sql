[package]
name = "smelt-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
smelt-core = { path = "../smelt-core" }
smelt-parser = { path = "../smelt-parser" }
smelt-db = { path = "../smelt-db" }
smelt-types = { path = "../smelt-types" }
smelt-planner = { path = "../smelt-planner" }
smelt-logical = { path = "../smelt-logical" }
smelt-backend = { path = "../smelt-backend" }
smelt-dialect = { path = "../smelt-dialect" }
smelt-state = { path = "../smelt-state" }

arrow.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
rowan.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
futures.workspace = true
line-index.workspace = true
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
# Test-only, back-edge dependency: `diagnostics.rs`'s tests prove
# `smelt-cli::explain`'s re-exported `build_relation_contract` is the exact
# same function this crate derives (`docs/specs/ui_model_diagnostics.md`
# §Design "Why a shared smelt-runtime builder"), not a second
# implementation. `smelt-cli` already depends on `smelt-runtime` as a normal
# dependency; a dev-dependency here only links test binaries, which Cargo
# permits even though it forms a cycle with the normal dependency graph.
smelt-cli = { path = "../smelt-cli" }
smelt-backend-duckdb = { path = "../smelt-backend-duckdb" }
smelt-backends = { path = "../smelt-backends" }
# Test-only, back-edge dependency (same shape as the `smelt-cli` edge
# above): the Link-C staged-project harness (`docs/outcomes/
# 20260809-probe-backed-facts/phases/08-plan.md`) is the shortest path to a
# real `execute_project` run over a declared-fact model for
# `tests/probe_manifest.rs`. `smelt-maintenance-testkit` already depends on
# `smelt-runtime` as a normal dependency; this only links test binaries.
smelt-maintenance-testkit = { path = "../smelt-maintenance-testkit" }
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
async-trait = "0.1"
arrow.workspace = true
duckdb = { workspace = true }
tracing-subscriber.workspace = true

[features]
python = ["smelt-core/python", "smelt-planner/python", "pyo3"]
