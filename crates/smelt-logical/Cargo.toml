[package]
name = "smelt-logical"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Logical model and planner-rule interface for smelt"
repository = "https://github.com/adbrowne/smelt-sql"

[dependencies]
smelt-core = { path = "../smelt-core" }
smelt-dialect = { path = "../smelt-dialect" }
smelt-parser = { path = "../smelt-parser" }
smelt-types = { path = "../smelt-types" }
chrono = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.10"
tracing.workspace = true

[dev-dependencies]
duckdb = { workspace = true }
proptest = { workspace = true }

[features]
default = []
bundled-duckdb = ["duckdb/bundled"]
