[package]
name = "smelt-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "smelt"
path = "src/main.rs"

[dependencies]
# Core smelt dependencies
smelt-core = { path = "../smelt-core" }
smelt-parser = { path = "../smelt-parser" }
smelt-db = { path = "../smelt-db" }
smelt-types = { path = "../smelt-types" }
smelt-optimizer = { path = "../smelt-optimizer" }
smelt-backend = { path = "../smelt-backend" }
smelt-backend-duckdb = { path = "../smelt-backend-duckdb", optional = true }
smelt-backend-spark = { path = "../smelt-backend-spark", optional = true }
smelt-ui = { path = "../smelt-ui" }

# Parser dependencies (for TextRange, etc.)
rowan.workspace = true

# Async runtime
tokio.workspace = true

# Execution
arrow = { workspace = true, features = ["prettyprint"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Config parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Date/time handling
chrono = "0.4"

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# File system
walkdir = "2.4"

[dev-dependencies]
tempfile = "3.8"

[features]
default = ["duckdb"]
duckdb = ["smelt-backend-duckdb"]
spark = ["smelt-backend-spark"]
