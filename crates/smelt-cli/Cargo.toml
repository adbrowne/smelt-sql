[package]
name = "smelt-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "smelt"
path = "src/main.rs"

[dependencies]
# Core smelt dependencies
smelt-core = { path = "../smelt-core" }
smelt-parser = { path = "../smelt-parser" }
smelt-db = { path = "../smelt-db" }
smelt-types = { path = "../smelt-types" }
smelt-planner = { path = "../smelt-planner" }
smelt-backend = { path = "../smelt-backend" }
smelt-dialect = { path = "../smelt-dialect" }
smelt-backend-duckdb = { path = "../smelt-backend-duckdb", optional = true, default-features = false }
duckdb = { workspace = true, optional = true }
smelt-backend-spark = { path = "../smelt-backend-spark", optional = true }
smelt-state = { path = "../smelt-state" }
smelt-ui = { path = "../smelt-ui" }

# Parser dependencies (for TextRange in graph tests)
rowan.workspace = true

# Async runtime
tokio.workspace = true

# Execution
arrow = { workspace = true, features = ["prettyprint"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Config parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Random number generation (for property-based tests)
rand = { workspace = true }

# Date/time handling
chrono = "0.4"

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Structured logging
tracing.workspace = true
tracing-subscriber.workspace = true

# File system
walkdir = "2.4"
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.8"

[features]
default = ["duckdb"]
duckdb = ["smelt-backend-duckdb", "dep:duckdb"]
bundled-duckdb = ["smelt-backend-duckdb/bundled", "duckdb/bundled"]
spark = ["smelt-backend-spark", "python"]
python = ["smelt-planner/python", "smelt-core/python", "pyo3"]
