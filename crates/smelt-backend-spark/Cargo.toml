[package]
name = "smelt-backend-spark"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Spark backend implementation for smelt via PySpark/PyO3 bridge"

[dependencies]
# Backend trait
smelt-backend = { path = "../smelt-backend" }

# Arrow (with pyarrow feature for zero-copy conversion)
arrow = { workspace = true, features = ["pyarrow"] }

# Python bridge
pyo3 = { workspace = true }

# Async runtime
tokio.workspace = true
async-trait = "0.1"

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# Parquet for Spark exchange (Arrow batches → temp file → Spark)
parquet.workspace = true
# Temp files for Parquet exchange
tempfile = "3.8"

[dev-dependencies]
