[package]
name = "smelt-maintenance-testkit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Dev-only Link-C schedule/oracle harness + model-shape catalogue for maintenance-plan equivalence testing. Not a production dependency of any crate."

[dependencies]
smelt-core = { path = "../smelt-core" }
smelt-db = { path = "../smelt-db" }
smelt-logical = { path = "../smelt-logical" }
smelt-backend = { path = "../smelt-backend" }
smelt-backend-duckdb = { path = "../smelt-backend-duckdb" }
smelt-runtime = { path = "../smelt-runtime" }
# Optional: only pulled in behind the `spark` feature (off by default) —
# `docs/plans/20260720-prod-w9-spark-conformance-twin.md` Phase 2 lands the
# dependency edge ahead of the Spark backend arms a later phase of that plan
# wires up; nothing in this crate constructs a Spark backend yet.
smelt-backend-spark = { path = "../smelt-backend-spark", optional = true }
# Optional: only pulled in behind the `bigquery` feature (off by default) —
# mirrors the `spark` feature's own comment above. Constructed by
# `link_c_harness.rs`'s `BigQueryBackendFactory`/`open_bigquery_backend` and
# `render.rs`/`dag.rs`/`feed.rs`'s BigQuery staging arms
# (`docs/plans/20260817-bigquery-generative-conformance.md`).
smelt-backend-bigquery = { path = "../smelt-backend-bigquery", optional = true }

duckdb.workspace = true
async-trait = "0.1"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
anyhow.workspace = true
chrono = "0.4"
proptest.workspace = true
tempfile = "3"
rowan.workspace = true
# Arrow record-batch access for the `Backend::execute_sql` count-extraction
# helper (`oracle.rs::except_all_row_count_via_backend`) — mirrors the same
# pattern already used by `crates/smelt-runtime/tests/statement_parity.rs`.
arrow.workspace = true

[features]
# Off by default (`cargo tree -p smelt-maintenance-testkit --no-default-features
# -i smelt-backend-spark` finds no edge) — wired to nothing yet; a later phase
# of `docs/plans/20260720-prod-w9-spark-conformance-twin.md` uses it to build
# the Spark arms of the seams this phase introduces.
spark = ["dep:smelt-backend-spark"]
# Off by default (`cargo tree -p smelt-maintenance-testkit --no-default-features
# -i smelt-backend-bigquery` finds no edge) — the BigQuery arm on the
# `ConformanceTarget` seam (`docs/plans/20260817-bigquery-generative-conformance.md`).
bigquery = ["dep:smelt-backend-bigquery"]

[dev-dependencies]
# Dev-only, test-target-only dependency (`schedule_gen.rs`'s
# `rewrite_model_step_changes_the_hash`, Phase 9 of
# `docs/plans/20260712-generative-maintenance-conformance.md`): the
# `RewriteModel` step's TDD test asserts against the REAL
# `smelt_state::intervals::compute_model_hash` the interval store keys
# coverage on, rather than a harness-local reimplementation. `smelt-runtime`
# (already a normal dependency above) itself depends on `smelt-state`, but
# Rust's extern prelude only exposes a crate's own direct dependencies, so
# this crate needs its own entry — mirrors the same class of addition
# `smelt-cli/Cargo.toml` already made for `smelt-state` in Phase 5.
smelt-state = { path = "../smelt-state" }
