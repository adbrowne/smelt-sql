[workspace]
members = ["crates/*"]
exclude = ["crates/smelt-parser/fuzz"]
resolver = "2"

[workspace.metadata.rust-analyzer]
# Enable proc macros for Salsa
procMacro.enable = true

# Dev-profile build-speed tuning: trim debuginfo to cut link time and target
# size. `line-tables-only` keeps usable backtraces; dependencies get none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.package]
version = "0.3.2"
edition = "2021"
authors = ["Andrew Browne"]
license = "MIT"

[workspace.dependencies]
# DataFusion for SQL parsing and logical plans
datafusion = "43"
# DuckDB for testing and execution
duckdb = { version = "1.10504.0", features = ["appender-arrow"] }
# Arrow for data interchange - must match duckdb's arrow version
arrow = "58"
# Parquet for data storage
parquet = "58"
# Parallel processing
rayon = "1.10"
# Error handling
anyhow = "1.0"
thiserror = "2.0"
# Async runtime
tokio = { version = "1", features = ["full"] }

# Salsa for incremental computation
salsa = "0.26"
# LSP infrastructure
tower-lsp = "0.20"
lsp-types = "0.94"  # Must match tower-lsp's version
# Rowan for CST (lossless concrete syntax tree)
rowan = "0.15"

# Random number generation
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
# UUID generation
uuid = { version = "1.0", features = ["v4"] }
# Date/time handling
chrono = "0.4"
# CLI argument parsing
clap = { version = "4", features = ["derive"] }
# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Ordered map (preserves insertion order)
indexmap = { version = "2", features = ["serde"] }
# Python embedding (abi3-py39 = stable ABI, works with any Python 3.9+)
pyo3 = { version = "0.28", features = ["auto-initialize", "abi3-py39"] }
# Property-based testing
proptest = "1.4"
# CSV parsing (strict tokenisation / quoting)
csv = "1.3"
# Line-index for TextSize ↔ (line, column) conversion at diagnostic boundaries
line-index = "0.1.2"
futures = "0.3"
