version: 1

sources:
  raw:
    tables:
      customers:
        description: "Customer dimension table"
        columns:
          - name: customer_id
            type: INTEGER
          - name: name_prefix
            type: VARCHAR
          - name: birth_year
            type: INTEGER
          - name: gender
            type: VARCHAR
          - name: email_domain
            type: VARCHAR
          - name: country
            type: VARCHAR
          - name: city
            type: VARCHAR
          - name: signup_date
            type: VARCHAR
          - name: segment
            type: VARCHAR

      products:
        description: "Product dimension table"
        columns:
          - name: product_id
            type: INTEGER
          - name: category
            type: VARCHAR
          - name: subcategory
            type: VARCHAR
          - name: brand_tier
            type: VARCHAR
          - name: unit_price_cents
            type: INTEGER
          - name: weight_grams
            type: INTEGER
          - name: is_digital
            type: BOOLEAN

      stores:
        description: "Store dimension table"
        columns:
          - name: store_id
            type: INTEGER
          - name: store_type
            type: VARCHAR
          - name: region
            type: VARCHAR
          - name: country
            type: VARCHAR
          - name: store_size
            type: VARCHAR

      orders:
        description: "Order fact table"
        columns:
          - name: order_id
            type: INTEGER
          - name: customer_id
            type: INTEGER
          - name: store_id
            type: INTEGER
          - name: order_date
            type: VARCHAR
          - name: status
            type: VARCHAR
          - name: payment_method
            type: VARCHAR
          - name: shipping_method
            type: VARCHAR
          - name: discount_pct
            type: INTEGER

      order_items:
        description: "Order line items fact table"
        columns:
          - name: order_item_id
            type: INTEGER
          - name: order_id
            type: INTEGER
          - name: product_id
            type: INTEGER
          - name: quantity
            type: INTEGER
          - name: unit_price_cents
            type: INTEGER
          - name: return_flag
            type: BOOLEAN
          - name: return_reason
            type: VARCHAR
          - name: item_date
            type: VARCHAR

      web_events:
        description: "Web analytics events"
        columns:
          - name: event_id
            type: INTEGER
          - name: customer_id
            type: INTEGER
          - name: event_type
            type: VARCHAR
          - name: page_category
            type: VARCHAR
          - name: referrer_source
            type: VARCHAR
          - name: device_type
            type: VARCHAR
          - name: event_date
            type: VARCHAR
