resources:
  jobs:
    github_activity_daily:
      name: "github_activity daily dogfood run"

      # Fires once a day. Free Edition has no fixed session-idle SLA
      # (docs-site/docs/guide/targets.md §"Free Edition constraints"), so a
      # once-a-day cadence keeps each run's serverless session short-lived by
      # construction.
      schedule:
        quartz_cron_expression: ${var.schedule_cron}
        timezone_id: "UTC"
        pause_status: UNPAUSED

      tasks:
        - task_key: load_next_day
          environment_key: loader_env
          spark_python_task:
            python_file: ../dbx_job/load_next_day.py
            parameters:
              - "--next-day"

        - task_key: smelt_run
          depends_on:
            - task_key: load_next_day
          environment_key: smelt_env
          spark_python_task:
            python_file: ../dbx_job/run_smelt.py
            parameters:
              - "/Volumes/${var.catalog}/${var.schema}/${var.volume_name}/project"

      # One serverless environment per task: the loader needs the pinned
      # Databricks Connect client stack (scripts/dbx-dogfood-requirements.txt
      # mirrors this pin); `smelt run` needs only the freshly-built wheel.
      # Neither task names any classic-compute shape — Free Edition is
      # serverless-only, so a paid-tier cluster cannot creep in here.
      environments:
        - environment_key: loader_env
          spec:
            # `client: "1"` failed every job-task launch on this workspace
            # ("Invalid platform channel Client-1 ... Workspace doesn't
            # support Client-1 channel for REPL") — measured phase 11c
            # against the `volume_probe` job, the first bundle-job task ever
            # run on this workspace (every prior live phase drove
            # `smelt run --target databricks` directly from this machine,
            # never through a Job). `client: "2"` launches cleanly.
            client: "2"
            dependencies:
              - databricks-connect==15.4.5
              - pyarrow
              - duckdb

        - environment_key: smelt_env
          spec:
            client: "2"
            # Serverless compute can land this task on either architecture
            # with no pinning mechanism on the platform side, and it can
            # change between runs (docs.databricks.com/compute/serverless/
            # dependencies) — so both wheels ship, disambiguated by a
            # platform_machine marker rather than a single unscoped glob.
            #
            # Referenced by deployed workspace path (`${workspace.file_path}`)
            # plus the exact filename (`${var.x86_64_wheel_name}` /
            # `${var.aarch64_wheel_name}`, set by `scripts/dbx-bundle.sh
            # deploy` from what it just built) — not a local relative glob,
            # and not a wildcard even at the workspace path: a local glob
            # here is checked by the bundle CLI against a location it cannot
            # resolve correctly for a `path: ../..` artifact synced alongside
            # this bundle (measured phase 11i; matches the unresolved
            # upstream regression databricks/cli#2969, DABs dist/.internal
            # cleanup), and pip's own `/Workspace/...` requirement resolver
            # does not expand `*` either (measured the same phase: "is not a
            # valid wheel filename"). The exact filename is what's left.
            # `${workspace.file_path}` is the bundle's *sync destination
            # root* (`.../dogfood/files`), not the bundle root's own uploaded
            # subtree — this bundle's external `sync.paths` entries
            # (`../../scripts`, `../../python`) push the sync root up to the
            # repo root, so the bundle root's own files land nested at
            # `files/examples/github_activity/...` (measured phase 11i via
            # `databricks workspace list`), hence the extra path segment.
            dependencies:
              - ${workspace.file_path}/examples/github_activity/dist/${var.x86_64_wheel_name}; platform_machine == "x86_64"
              - ${workspace.file_path}/examples/github_activity/dist/${var.aarch64_wheel_name}; platform_machine == "aarch64"

    # A one-off job, run manually (`scripts/dbx-bundle.sh run volume_probe`),
    # never scheduled — it measures the deployed Volume's FUSE-layer
    # filesystem guarantees (phases/11c-plan.md) rather than doing pipeline
    # work. Kept as a separate job resource, not a task on the daily job, so
    # a probe run never counts as one of the three scheduled proof runs.
    github_activity_volume_probe:
      name: "github_activity Volume FUSE probe"
      tasks:
        - task_key: volume_probe
          environment_key: probe_env
          spark_python_task:
            python_file: ../dbx_job/volume_probe.py
            parameters:
              - "/Volumes/${var.catalog}/${var.schema}/${var.volume_name}/project"
      environments:
        - environment_key: probe_env
          spec:
            client: "2"
