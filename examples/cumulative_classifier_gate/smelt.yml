name: cumulative_classifier_gate
version: 1

# Hermetic fixture for the refresh: keyed classifier gate
# (docs/specs/incremental_models.md §"Key-grain diagnostic codes";
# §"Key-grain constraints" #4: "The catalogue is closed and the classifier
# is fail-closed"). The driving
# source is a self-contained VALUES literal so the workspace runs via
# `smelt run`/`build` with no external seed.
#
# Driven by crates/smelt-cli/tests/e2e/cumulative_classifier_gate.rs:
#   - edges_valid: a well-formed keyed model builds (guards against over-rejection)
#   - edges_bad_aggregator: STRING_AGG must be REFUSED even with no run window
#     (the classifier must run on the no-window full-refresh path too).

paths:
  - models

targets:
  dev:
    type: duckdb
    database: target/dev.duckdb
    schema: main

default_materialization: view
