name: smelt_examples
version: 1

paths:
  - models
  - tests
  - seeds

targets:
  dev:
    type: duckdb
    database: target/dev.duckdb
    schema: main

  spark:
    type: spark
    connect_url: sc://localhost:15002
    catalog: spark_catalog
    schema: main

default_materialization: view

# `daily_event_counts_deferred` declares `contract.deferral`, whose lag is
# measured against the interval ledger and landed-delta record — the
# `stateless` default withholds them, so this project opts into `intervals`
# (`docs/specs/state.md` §"Declarations stay fail-loud").
state:
  mode: intervals

models:
  users:
    materialization: table
  events:
    materialization: table
  user_activity:
    materialization: table
  transactions:
    materialization: table
  daily_revenue:
    materialization: table
    refresh: incremental
    grain: partition
    timeseries:
      event_time_column: transaction_timestamp  # Column in SOURCE data (for WHERE filter)
      partition_column: revenue_date             # Column in OUTPUT (for DELETE)
      granularity: day
      # For demo: process one day at a time
      # In production: would use watermarks, lookback windows, etc.
  cube_metrics:
    materialization: table
  daily_events_status:
    # `event_id` is the fact source's own declared `unique_key`
    # (`models/sources/raw/events.yml`) and, since this model neither
    # aggregates nor fans the join out, still uniquely identifies each
    # output row. `merge_key:` is the write/dedup key a column-scoped MERGE
    # technique writes on — never the *identity* fact top-level `unique_key:`
    # is (grain-determining, requiring an aggregated `GROUP BY` body for a
    # clocked model, which this row-shaped join is not); see
    # `docs/specs/models.md` §"Batched sub-block retirement".
    merge_key: [event_id]
  daily_events_enriched:
    # See `daily_events_status`'s comment above — the same MERGE-dedup-only
    # `merge_key:`, needed because this model's own row-shaped join cannot
    # become the composed key+clock shape (no `GROUP BY` to satisfy
    # `KeyedRequiresGroupBy`).
    merge_key: [event_id]
