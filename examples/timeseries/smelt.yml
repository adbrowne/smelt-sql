name: smelt_examples
version: 1

paths:
  - models
  - tests
  - seeds

targets:
  dev:
    type: duckdb
    database: target/dev.duckdb
    schema: main

  spark:
    type: spark
    connect_url: sc://localhost:15002
    catalog: spark_catalog
    schema: main

default_materialization: view

models:
  users:
    materialization: table
  events:
    materialization: table
  user_activity:
    materialization: table
  transactions:
    materialization: table
  daily_revenue:
    materialization: table
    refresh: incremental
    grain: partition
    timeseries:
      event_time_column: transaction_timestamp  # Column in SOURCE data (for WHERE filter)
      partition_column: revenue_date             # Column in OUTPUT (for DELETE)
      granularity: day
      # For demo: process one day at a time
      # In production: would use watermarks, lookback windows, etc.
  cube_metrics:
    materialization: table
  daily_events_status:
    # `event_id` is the fact source's own declared `unique_key`
    # (`models/sources/raw/events.yml`) and, since this model neither
    # aggregates nor fans the join out, still uniquely identifies each
    # output row. The `.sql` frontmatter `batched:` sub-block this used to
    # carry `unique_key` under is retired (`docs/specs/models.md` §"The
    # Relation Contract"); a top-level `unique_key:` in `.sql` frontmatter
    # is the *identity* fact instead (grain-determining, requiring an
    # aggregated `GROUP BY` body for a clocked model), which this row-shaped
    # join is not — so the MERGE-dedup-only `batched.unique_key` spelling
    # stays declared here, in the `smelt.yml` model override the sub-block
    # retirement does not touch.
    batched:
      unique_key: [event_id]
  daily_events_enriched:
    # See `daily_events_status`'s comment above — the same MERGE-dedup-only
    # `batched.unique_key`, kept in `smelt.yml` since this model's own
    # row-shaped join cannot become the composed key+clock shape (no
    # `GROUP BY` to satisfy `KeyedRequiresGroupBy`).
    batched:
      unique_key: [event_id]
