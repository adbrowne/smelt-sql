description: Time-varying user status (clocked, mutable dimension)
columns:
- name: user_id
  type: INTEGER
- name: status
  type: VARCHAR
- name: changed_at
  type: TIMESTAMP
# Clocked (unlike `raw.users`): `changed_at` tracks when a row last mutated,
# and `daily_events_status.sql`'s join carries an explicit, derivable
# predicate on this column relative to the fact's own event timestamp — so
# `link_source` (`smelt-logical::maintenance::derive`) links it to the
# output partition axis via a genuine `ScanClamp` (`PartitionLocal::Yes`)
# instead of falling back to the accepted-full-scan corner `raw.users`
# exercises (`PartitionLocal::No`).
timeseries:
  partition_column: changed_at
  event_time_column: changed_at
  granularity: day
# Declared so the mutation-driven column-scoped MERGE (MP11) can prove its
# join against this dimension does not fan out (`join_shape::fan_out`,
# `smelt_runtime::maintenance_driver::dimension_join_contribution`) —
# licensing the horizon-clamped merge (F15) without re-reading the fact.
unique_key: [user_id]
# A dimension: rows may be corrected in place after creation. Declared
# explicitly (not the fail-closed default) so `daily_events_status`'s
# `UpstreamMutation` cell derives (`maintenance_plan.md` §"Per-cell
# admission").
mutation_profile:
  kind: mutable_snapshot
