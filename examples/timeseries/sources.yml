version: 1

sources:
  raw:
    tables:
      users:
        description: Raw user data
        columns:
          - name: user_id
            type: INTEGER
          - name: user_name
            type: VARCHAR
          - name: signup_date
            type: DATE

      events:
        description: Raw event data
        columns:
          - name: event_id
            type: INTEGER
          - name: user_id
            type: INTEGER
          - name: event_type
            type: VARCHAR
          - name: event_timestamp
            type: TIMESTAMP
          - name: properties
            type: VARCHAR
            description: JSON-encoded event properties

      transactions:
        description: Transaction events with timestamps and amounts
        columns:
          - name: transaction_id
            type: INTEGER
            description: Unique transaction identifier
          - name: user_id
            type: INTEGER
            description: User who made the transaction
          - name: amount
            type: DECIMAL(10,2)
            description: Transaction amount
          - name: transaction_timestamp
            type: TIMESTAMP
            description: When the transaction occurred
          - name: transaction_type
            type: VARCHAR
            description: Type of transaction (purchase, refund, etc.)
      sessions:
        description: User session data
        columns:
          - name: session_id
            type: INTEGER
          - name: user_id
            type: INTEGER
          - name: session_start
            type: TIMESTAMP
          - name: session_end
            type: TIMESTAMP
          - name: visitor_id
            type: INTEGER
          - name: product_views
            type: INTEGER
          - name: widget_views
            type: INTEGER
          - name: product_revenue
            type: DECIMAL(10,2)
          - name: visit_source
            type: VARCHAR
          - name: platform
            type: VARCHAR
          - name: visit_campaign
            type: VARCHAR
          - name: product_category
            type: VARCHAR
          - name: foo_bar
            type: VARCHAR
