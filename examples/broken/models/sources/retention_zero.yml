description: retention is a zero-length interval, which is inert.
columns:
  - name: id
    type: BIGINT
    nullable: false
  - name: event_ts
    type: TIMESTAMP
    nullable: false
  - name: event_date
    type: DATE
    nullable: false
timeseries:
  event_time_column: event_ts
  partition_column: event_date
  granularity: day
retention: '0 days'
