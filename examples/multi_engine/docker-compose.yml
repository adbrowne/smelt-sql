services:
  spark:
    image: apache/spark:3.5.3
    command: /opt/spark/sbin/start-connect-server.sh --master local[*] --conf spark.sql.warehouse.dir=/data/spark-warehouse
    ports:
      - "15002:15002"
      - "4040:4040"
    volumes:
      - ./data:/data/input
      - ./target/spark:/data/spark-warehouse
    environment:
      - SPARK_NO_DAEMONIZE=true
