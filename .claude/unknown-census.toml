# DataType::Unknown construction site allowlist.
# Every production site where DataType::Unknown is *produced* must appear here.
# classification = "legitimate" | "error"
#   legitimate: deliberate conservatism — meta-type/polymorphic/already-diagnosed
#   error: should eventually emit a diagnostic (tracked in the hardening plan)
# discriminant = "unresolved" | "dynamic" | "propagated"
#   unresolved: compiler-resolvable gap — ColumnTypeUnresolved fires here
#   dynamic:    legitimately unknown at compile time — no column diagnostic
#   propagated: input was already Unknown; cascading suppression
#   (error classification must have discriminant = "unresolved")
#
# Maintained by: Phase 2 of docs/plans/20260620-unknown-reason-discriminant.md
# Guard test:    crates/smelt-types/tests/unknown_census.rs
# Census script: .claude/scripts/unknown-census.sh

