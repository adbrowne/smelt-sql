[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "smelt-sql"
dynamic = ["version"]
description = "Modern data transformation framework"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Andrew Browne" }]
keywords = ["sql", "data", "pipeline", "analytics"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/adbrowne/smelt-sql"

[tool.maturin]
manifest-path = "crates/smelt-cli/Cargo.toml"
bindings = "bin"
strip = true
python-packages = ["smelt_sql"]
data = "smelt_sql.data"
include = [{path = "LICENSE", format = "sdist"}]
