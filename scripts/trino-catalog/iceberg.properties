# Iceberg REST catalog, backed by MinIO object storage. Endpoints are the
# compose service names (iceberg-rest, minio), not a loopback address — Trino
# reaches them over the compose network, not the host's published ports.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/

# Native S3 filesystem support (fs.native-s3.enabled), not the legacy
# hive.s3.* properties — Trino 420+ prefers this path for the Iceberg
# connector talking to an S3-compatible endpoint.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=password
