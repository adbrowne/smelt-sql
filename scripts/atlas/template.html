<title>smelt · Maintenance Atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --ground: #F4F3F0;
  --panel: #FBFAF8;
  --panel-2: #EEECE7;
  --ink: #211D18;
  --ink-2: #5C564D;
  --ink-3: #8A8378;
  --line: #DDD9D1;
  --line-2: #CCC7BD;
  --accent: #C65A1E;
  --accent-ink: #A34712;
  --accent-soft: #F3DFD2;
  --good: #4A7D42;
  --good-soft: #E2ECDE;
  --warn: #A8842B;
  --warn-soft: #F1E9D4;
  --bad: #A5453A;
  --bad-soft: #F0DFDC;
  --t-di: #4A6FA5;
  --t-di-soft: #E0E7F0;
  --t-kf: #7B5EA7;
  --t-kf-soft: #E8E2F1;
  --t-csm: #C65A1E;
  --t-csm-soft: #F3DFD2;
  --t-ipu: #5A7D4A;
  --t-ipu-soft: #E2ECDE;
  --code-bg: #211D18;
  --code-ink: #E8E2D8;
  --shadow: 0 1px 2px rgba(33,29,24,.06), 0 4px 14px rgba(33,29,24,.05);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --serif: ui-serif, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #171310;
    --panel: #201B17;
    --panel-2: #2A241F;
    --ink: #EDE6DC;
    --ink-2: #B0A797;
    --ink-3: #7E766A;
    --line: #362F28;
    --line-2: #453C33;
    --accent: #E0762F;
    --accent-ink: #E88A48;
    --accent-soft: #3B2718;
    --good: #8CB47C;
    --good-soft: #26301F;
    --warn: #CFAE58;
    --warn-soft: #352D17;
    --bad: #CF7A6E;
    --bad-soft: #38211D;
    --t-di: #82A4D6;
    --t-di-soft: #1F2938;
    --t-kf: #AC93D8;
    --t-kf-soft: #2A2338;
    --t-csm: #E0762F;
    --t-csm-soft: #3B2718;
    --t-ipu: #8CB47C;
    --t-ipu-soft: #26301F;
    --code-bg: #12100D;
    --code-ink: #D8D0C2;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --ground: #171310;
  --panel: #201B17;
  --panel-2: #2A241F;
  --ink: #EDE6DC;
  --ink-2: #B0A797;
  --ink-3: #7E766A;
  --line: #362F28;
  --line-2: #453C33;
  --accent: #E0762F;
  --accent-ink: #E88A48;
  --accent-soft: #3B2718;
  --good: #8CB47C;
  --good-soft: #26301F;
  --warn: #CFAE58;
  --warn-soft: #352D17;
  --bad: #CF7A6E;
  --bad-soft: #38211D;
  --t-di: #82A4D6;
  --t-di-soft: #1F2938;
  --t-kf: #AC93D8;
  --t-kf-soft: #2A2338;
  --t-csm: #E0762F;
  --t-csm-soft: #3B2718;
  --t-ipu: #8CB47C;
  --t-ipu-soft: #26301F;
  --code-bg: #12100D;
  --code-ink: #D8D0C2;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
}
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

.app { display: flex; min-height: 100vh; }

/* ---------- sidebar ---------- */
.side {
  width: 268px;
  flex: 0 0 268px;
  border-right: 1px solid var(--line);
  background: var(--panel);
  padding: 20px 0 40px;
  position: sticky;
  top: 0;
  align-self: flex-start;
  max-height: 100vh;
  overflow-y: auto;
}
.brand {
  padding: 2px 20px 14px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
}
.brand a { color: var(--ink); }
.brand a:hover { text-decoration: none; }
.brand .word {
  font-family: var(--serif);
  font-size: 21px;
  letter-spacing: .01em;
}
.brand .word b { color: var(--accent); font-weight: 600; }
.brand .sub {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-top: 2px;
}
.side .grp { margin: 0 0 6px; }
.side .grp-h {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 10px 20px 4px;
}
.side .mrow {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 20px;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--ink-2);
  border-left: 3px solid transparent;
}
.side a.mrow:hover { background: var(--panel-2); text-decoration: none; color: var(--ink); }
.side .mrow.on {
  border-left-color: var(--accent);
  background: var(--panel-2);
  color: var(--ink);
}
.side .mrow .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side .mrow .dots { display: flex; gap: 3px; flex: 0 0 auto; }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.side .rest {
  padding: 3px 20px 8px;
  font-size: 11.5px;
  color: var(--ink-3);
  font-family: var(--mono);
}

/* ---------- main ---------- */
.main { flex: 1 1 auto; min-width: 0; padding: 30px 38px 90px; }
.wrap { max-width: 1060px; margin: 0 auto; }

.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin: 0 0 6px;
}
h1 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 34px;
  line-height: 1.15;
  margin: 0 0 10px;
  text-wrap: balance;
}
h2 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 21px;
  margin: 44px 0 6px;
  text-wrap: balance;
}
h2:first-child { margin-top: 0; }
.lede { color: var(--ink-2); max-width: 68ch; margin: 0 0 4px; }
.note { color: var(--ink-3); font-size: 12.5px; max-width: 78ch; }
code, .mono { font-family: var(--mono); font-size: .92em; }
p code { background: var(--panel-2); padding: 1px 4px; border-radius: 3px; }

/* chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid transparent;
  white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; }
.chip.t-DeleteInsert { background: var(--t-di-soft); color: var(--t-di); border-color: color-mix(in srgb, var(--t-di) 35%, transparent); }
.chip.t-KeyedFold { background: var(--t-kf-soft); color: var(--t-kf); border-color: color-mix(in srgb, var(--t-kf) 35%, transparent); }
.chip.t-ColumnScopedMerge { background: var(--t-csm-soft); color: var(--t-csm); border-color: color-mix(in srgb, var(--t-csm) 40%, transparent); }
.chip.t-InPlaceUpdate { background: var(--t-ipu-soft); color: var(--t-ipu); border-color: color-mix(in srgb, var(--t-ipu) 35%, transparent); }
.chip.plain { background: var(--panel-2); color: var(--ink-2); border-color: var(--line-2); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }

/* census */
.census {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin: 18px 0 8px;
}
.stat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  box-shadow: var(--shadow);
}
.stat .v {
  font-family: var(--mono);
  font-size: 26px;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.stat .k {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 4px;
}
.censusbar {
  display: flex;
  height: 14px;
  border-radius: 7px;
  overflow: hidden;
  margin: 16px 0 8px;
  border: 1px solid var(--line);
}
.censusbar div { height: 100%; }

/* field guide */
.guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 14px; }
.gcard {
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 4px solid var(--line-2);
  border-radius: 8px;
  padding: 12px 14px;
  box-shadow: var(--shadow);
}
.gcard.t-DeleteInsert { border-left-color: var(--t-di); }
.gcard.t-KeyedFold { border-left-color: var(--t-kf); }
.gcard.t-ColumnScopedMerge { border-left-color: var(--t-csm); }
.gcard.t-InPlaceUpdate { border-left-color: var(--t-ipu); }
.gcard h3 { font-family: var(--mono); font-size: 13px; margin: 0 0 5px; }
.gcard p { font-size: 12.8px; color: var(--ink-2); margin: 0; }
.gcard .n { float: right; font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* dag */
.dagbox {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  margin-top: 14px;
  overflow-x: auto;
  box-shadow: var(--shadow);
}
.dagbox figure { margin: 0; }
.dagbox figcaption { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.dag-node { cursor: default; }
.dag-node.link { cursor: pointer; }
.dag-node rect { fill: var(--panel-2); stroke: var(--line-2); rx: 4; }
.dag-node.inc rect { stroke-width: 1.6; }
.dag-node.link:hover rect { fill: var(--accent-soft); }
.dag-node text { font-family: var(--mono); font-size: 10.5px; fill: var(--ink); }
.dag-edge { fill: none; stroke: var(--line-2); stroke-width: 1.1; }

/* specimens */
.specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin-top: 14px; }
.spec {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.spec h3 { font-family: var(--mono); font-size: 13.5px; margin: 0; }
.spec p { font-size: 12.8px; color: var(--ink-2); margin: 0; flex: 1 1 auto; }
.spec .row { display: flex; gap: 6px; flex-wrap: wrap; }

/* model view */
.mhead { border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 22px; }
.contract {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.kv {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 11px;
  font-family: var(--mono);
  font-size: 12px;
}
.kv b { color: var(--ink-3); font-weight: 400; margin-right: 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }

.edges { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.edge {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 12.5px;
}
.edge .arr { color: var(--accent); }

/* cell cards */
.cell {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  margin-top: 16px;
  overflow: hidden;
}
.cell-h {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(to bottom, var(--panel), var(--panel-2));
}
.cell-h .grp { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.cell-h .tr { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.cell-h .spacer { flex: 1 1 auto; }
.cell-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 1px;
  background: var(--line);
}
.cell-meta > div { background: var(--panel); padding: 8px 16px; }
.cell-meta .k {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.cell-meta .v { font-family: var(--mono); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.cell-meta .wide { grid-column: 1 / -1; }

.tourney { border-top: 1px solid var(--line); padding: 12px 16px 14px; }
.tourney .t-h {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 8px;
}
.tourney-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 10px; }
.tent {
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 9px 11px;
  background: var(--ground);
}
.tent.win { border-color: color-mix(in srgb, var(--good) 55%, transparent); background: var(--good-soft); }
.tent .t-name { font-family: var(--mono); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.tent .verdict { font-family: var(--mono); font-size: 10.5px; margin-left: auto; }
.tent.win .verdict { color: var(--good); }
.tent .why { font-size: 11.8px; color: var(--ink-2); margin-top: 6px; line-height: 1.45; }

details.sqlbox { border-top: 1px solid var(--line); }
details.sqlbox summary {
  cursor: pointer;
  padding: 9px 16px;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink-2);
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
details.sqlbox summary::before { content: "▸"; color: var(--accent); font-size: 10px; transition: transform .12s; }
details.sqlbox[open] summary::before { transform: rotate(90deg); }
details.sqlbox summary:hover { background: var(--panel-2); }
.sqlwrap { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px; }
pre.sql {
  margin: 0;
  background: var(--code-bg);
  color: var(--code-ink);
  border-radius: 7px;
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 11.8px;
  line-height: 1.5;
  overflow-x: auto;
  tab-size: 4;
}
pre.sql .kw { color: var(--accent-ink); }
.txg { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) {
  details.sqlbox summary::before { transition: none; }
}

/* properties table */
table.props {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  font-size: 12.5px;
}
table.props th, table.props td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--line); }
table.props th {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
  background: var(--panel-2);
}
table.props td { font-family: var(--mono); font-size: 12px; }
table.props tr:last-child td { border-bottom: none; }
.tblwrap { overflow-x: auto; }
.flags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

@media (max-width: 860px) {
  .app { flex-direction: column; }
  .side { width: auto; flex: none; position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--line); }
  .main { padding: 22px 18px 70px; }
}
</style>

<div class="app">
  <nav class="side" id="side" aria-label="Atlas index"></nav>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<script type="application/json" id="atlas-data">__ATLAS_DATA__</script>

__ATLAS_APP_JS__</script>
